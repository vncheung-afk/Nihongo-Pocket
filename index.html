<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Poketto" />
  <meta name="theme-color" content="#1A1A1A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Poketto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F6F3; --ink: #1A1A1A; --mid: #6B6966; --muted: #B0ADA6;
      --line: #E8E6E1; --gold: #C8A96E; --card-bg: #FFFFFF; --card-back: #1A1A1A;
      --red: #C0392B; --green: #4A8A6A;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body { height:100%; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; }
    .header { padding:calc(var(--safe-top) + 16px) 20px 12px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; background:var(--bg); }
    .header-logo { font-family:'Noto Serif JP',serif; font-size:18px; font-weight:400; letter-spacing:1px; }
    .header-sub { font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-top:2px; }
    .btn-add-top { background:var(--ink); color:var(--bg); border:none; border-radius:3px; cursor:pointer; font-family:inherit; font-size:10px; font-weight:500; letter-spacing:.06em; padding:8px 14px; }
    .nav { display:flex; border-bottom:1px solid var(--line); padding:0 20px; flex-shrink:0; background:var(--bg); }
    .nav-btn { background:none; border:none; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); padding:10px 14px 9px; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s,border-color .15s; }
    .nav-btn.active { color:var(--ink); border-bottom-color:var(--ink); }
    .scroll-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 20px calc(var(--safe-bottom) + 24px); }
    .filter-row { display:flex; gap:7px; padding:12px 0 4px; overflow-x:auto; scrollbar-width:none; }
    .filter-row::-webkit-scrollbar { display:none; }
    .chip { flex-shrink:0; padding:5px 11px; border-radius:20px; font-size:10px; font-weight:500; letter-spacing:0.5px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--mid); font-family:inherit; transition:all .15s; white-space:nowrap; display:flex; align-items:center; gap:5px; }
    .chip.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
    .type-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; display:inline-block; }
    .search-wrap { position:relative; margin:10px 0 4px; }
    .search-input { width:100%; padding:9px 12px 9px 34px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:13px; color:var(--ink); outline:none; -webkit-appearance:none; transition:border-color .15s; }
    .search-input:focus { border-color:var(--ink); }
    .search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none; }
    .search-clear { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px; padding:2px 4px; display:none; }
    .search-clear.visible { display:block; }
    .progress-bar { display:flex; gap:3px; padding:16px 0 12px; }
    .progress-seg { flex:1; height:2px; border-radius:1px; background:var(--line); }
    .progress-seg.done { background:var(--ink); }
    .progress-seg.current { background:var(--gold); }
    .card-wrap { perspective:1200px; cursor:pointer; user-select:none; -webkit-user-select:none; }
    .card-inner { position:relative; width:100%; height:230px; transform-style:preserve-3d; transition:transform 0.5s cubic-bezier(.4,0,.2,1); }
    .card-inner.flipped { transform:rotateY(180deg); }
    .card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
    .card-front { background:var(--card-bg); border:1px solid var(--line); }
    .card-back { background:var(--card-back); transform:rotateY(180deg); color:var(--bg); }
    .card-type-label { position:absolute; top:12px; left:14px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; font-weight:500; }
    .card-jp { font-family:'Noto Serif JP',serif; font-size:54px; font-weight:300; letter-spacing:-1px; line-height:1; }
    .card-reading { font-family:'Noto Serif JP',serif; font-size:13px; color:var(--gold); margin-top:10px; letter-spacing:2px; }
    .card-meaning { font-size:17px; font-weight:400; text-align:center; line-height:1.4; color:var(--bg); }
    .flip-hint { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:12px; font-weight:500; }
    .forms-panel { background:var(--card-bg); border:1px solid var(--line); border-radius:4px; margin-top:10px; overflow:hidden; opacity:0; transform:translateY(5px); transition:opacity .25s,transform .25s; pointer-events:none; }
    .forms-panel.visible { opacity:1; transform:none; pointer-events:auto; }
    .fg-header { display:flex; align-items:center; justify-content:space-between; padding:8px 14px; cursor:pointer; border-bottom:1px solid var(--line); background:var(--bg); user-select:none; }
    .fg-title { font-size:9px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); font-weight:500; }
    .fg-arrow { font-size:9px; color:var(--muted); transition:transform .2s; display:inline-block; }
    .fg-arrow.open { transform:rotate(90deg); }
    .fg-body { display:none; }
    .fg-body.open { display:block; }
    .form-row { display:flex; align-items:baseline; padding:7px 14px; border-bottom:1px solid var(--line); gap:10px; }
    .form-row:last-child { border-bottom:none; }
    .form-lbl { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-weight:500; width:76px; flex-shrink:0; line-height:1.5; }
    .form-val { font-family:'Noto Serif JP',serif; font-size:14px; color:var(--ink); }
    .edited-badge { font-size:8px; letter-spacing:1px; color:var(--gold); text-transform:uppercase; font-weight:600; margin-left:6px; }
    .grade-row { display:flex; gap:10px; margin-top:10px; transition:opacity .2s; }
    .grade-row.hidden { opacity:0; pointer-events:none; }
    .btn { flex:1; border:none; cursor:pointer; font-family:inherit; font-size:12px; font-weight:500; letter-spacing:.06em; border-radius:3px; padding:11px; transition:all .15s; }
    .btn-known { background:var(--ink); color:var(--bg); }
    .btn-learning { background:transparent; color:var(--ink); border:1px solid var(--line); }
    .session-counter { text-align:center; font-size:11px; color:var(--muted); margin-top:9px; }
    .done-screen { text-align:center; padding:48px 0; }
    .done-kanji { font-family:'Noto Serif JP',serif; font-size:50px; color:var(--gold); margin-bottom:6px; }
    .done-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:32px; }
    .done-stats { display:flex; justify-content:center; margin-bottom:36px; }
    .done-stat { padding:0 26px; }
    .done-stat+.done-stat { border-left:1px solid var(--line); }
    .done-num { font-size:36px; font-weight:300; }
    .done-stat-label { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:3px; }
    .section-hd { padding:16px 0 6px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:7px; }
    .word-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
    .word-row:last-child { border-bottom:none; }
    .word-jp { font-family:'Noto Serif JP',serif; font-size:16px; }
    .word-kana { font-family:'Noto Serif JP',serif; font-size:10px; color:var(--muted); margin-left:6px; }
    .word-meaning { font-size:11px; color:var(--mid); margin-top:1px; }
    .word-meta { font-size:9px; color:var(--gold); margin-top:1px; }
    .recall-pill { flex-shrink:0; font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px; background:#F0EDE6; color:var(--gold); }
    .del-btn { background:none; border:none; cursor:pointer; font-size:12px; color:var(--muted); padding:6px; flex-shrink:0; }
    .no-results { text-align:center; padding:40px 0; font-size:13px; color:var(--muted); }
    .form-screen { padding:16px 0; display:flex; flex-direction:column; gap:14px; }
    .field-label { display:block; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:6px; }
    .field-input { width:100%; padding:10px 12px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:14px; color:var(--ink); outline:none; transition:border-color .15s; -webkit-appearance:none; }
    .field-input:focus { border-color:var(--ink); }
    .jp-input { font-family:'Noto Serif JP',serif !important; font-size:18px !important; }
    .type-chips { display:flex; gap:7px; flex-wrap:wrap; }
    .type-chip { padding:6px 12px; border-radius:20px; font-size:10px; font-weight:500; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--mid); font-family:inherit; transition:all .15s; }
    .type-chip.selected { background:var(--ink); color:var(--bg); border-color:var(--ink); }
    .notice { font-size:11px; color:var(--mid); background:#F0EDE6; border-radius:3px; padding:8px 12px; line-height:1.5; }
    .notice b { color:var(--gold); font-weight:600; }
    .btn-primary { width:100%; background:var(--ink); color:var(--bg); border:none; border-radius:3px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:500; padding:13px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
    .modal-overlay.hidden { display:none; }
    .modal { background:var(--bg); border-radius:14px 14px 0 0; width:100%; max-width:560px; max-height:92vh; display:flex; flex-direction:column; padding-bottom:var(--safe-bottom); }
    .modal-header { display:flex; align-items:flex-start; justify-content:space-between; padding:18px 20px 12px; border-bottom:1px solid var(--line); flex-shrink:0; }
    .modal-title { font-family:'Noto Serif JP',serif; font-size:22px; font-weight:300; }
    .modal-subtitle { font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-top:3px; }
    .modal-close { background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); padding:4px 6px; }
    .modal-body { overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }
    .modal-footer { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:10px; flex-shrink:0; align-items:center; }
    .btn-danger { background:transparent; color:var(--red); border:1px solid #E8C4C0; border-radius:3px; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500; padding:8px 14px; }
    .btn-save { background:var(--ink); color:var(--bg); border:none; border-radius:3px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:500; padding:10px 20px; margin-left:auto; }
    .detail-section { padding:14px 20px; border-bottom:1px solid var(--line); }
    .detail-section:last-child { border-bottom:none; }
    .dfl { font-size:9px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:5px; }
    .dfi { width:100%; padding:8px 10px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:13px; color:var(--ink); outline:none; -webkit-appearance:none; transition:border-color .15s; }
    .dfi:focus { border-color:var(--ink); }
    .dfi.jp { font-family:'Noto Serif JP',serif; font-size:17px; }
    .recall-row { display:flex; gap:24px; }
    .recall-stat-num { font-size:28px; font-weight:300; }
    .recall-stat-label { font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-top:2px; }
    .fe-sec-hd { padding:9px 20px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:500; background:var(--bg); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
    .auto-badge { font-size:8px; letter-spacing:1px; color:var(--green); font-weight:600; }
    .fe-group { border-bottom:1px solid var(--line); }
    .fe-group:last-child { border-bottom:none; }
    .fe-gh { padding:9px 20px; font-size:10px; font-weight:500; color:var(--mid); cursor:pointer; display:flex; align-items:center; justify-content:space-between; user-select:none; }
    .fe-gb { display:none; padding:4px 20px 10px; }
    .fe-gb.open { display:block; }
    .fe-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .fe-lbl { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-weight:500; width:76px; flex-shrink:0; line-height:1.5; }
    .fe-inp { flex:1; padding:7px 10px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:'Noto Serif JP',serif; font-size:14px; color:var(--ink); outline:none; -webkit-appearance:none; }
    .fe-inp.auto { border-color:transparent; background:#F7F9F7; color:var(--mid); }
    .fe-inp.edited { border-color:var(--gold); background:#FDFAF4; }
    .fe-reset { background:none; border:none; cursor:pointer; font-size:13px; color:var(--muted); padding:3px 5px; flex-shrink:0; }
    .empty { text-align:center; padding:60px 0; }
    .empty-char { font-family:'Noto Serif JP',serif; font-size:42px; color:var(--line); margin-bottom:12px; }
    .empty-text { font-size:12px; color:var(--muted); }
    .settings-screen { padding:16px 0 32px; display:flex; flex-direction:column; gap:18px; }
    .settings-section { border-bottom:1px solid var(--line); padding-bottom:16px; }
    .settings-section:last-child { border-bottom:none; }
    .settings-title { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:8px; }
    .settings-copy { font-size:12px; line-height:1.55; color:var(--mid); margin-bottom:12px; }
    .settings-row { display:flex; gap:10px; flex-wrap:wrap; }
    .settings-btn { background:var(--card-bg); color:var(--ink); border:1px solid var(--line); border-radius:3px; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500; letter-spacing:.04em; padding:10px 13px; }
    .settings-btn.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
    .settings-btn.danger { color:var(--red); border-color:#E8C4C0; }
    .settings-file { display:none; }
    .settings-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px; }
    .settings-stat { background:var(--card-bg); border:1px solid var(--line); border-radius:4px; padding:10px; }
    .settings-num { font-size:24px; font-weight:300; }
    .settings-label { font-size:8px; letter-spacing:1.1px; text-transform:uppercase; color:var(--muted); margin-top:2px; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div>
      <div class="header-logo">Poketto</div>
      <div class="header-sub" id="header-sub">0 words</div>
    </div>
    <button class="btn-add-top" id="add-btn">+ Add Word</button>
  </div>
  <div class="nav">
    <button class="nav-btn active" data-tab="review">Review</button>
    <button class="nav-btn" data-tab="words">Words</button>
    <button class="nav-btn" data-tab="settings">Settings</button>
  </div>
  <div class="scroll-area" id="main-content"></div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <button class="modal-close" id="modal-close">&#x2715;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
var TYPE_COLORS = {"verb-u":"#7C9EBF","verb-ru":"#5B8FA8","verb-irr":"#4A7A8A","i-adj":"#9B7EC8","na-adj":"#B07FC4","noun":"#8AAE8A","expression":"#C8A96E"};
var TYPE_LABELS = {"verb-u":"u-verb","verb-ru":"ru-verb","verb-irr":"Irr. verb","i-adj":"i-adj","na-adj":"na-adj","noun":"Noun","expression":"Expression"};
var ALL_TYPES = Object.keys(TYPE_LABELS);

var VERB_GROUPS = [
  {key:"basic",label:"Basic",forms:[{key:"te",label:"te-form"},{key:"ta",label:"past"},{key:"nai",label:"negative"},{key:"masu",label:"polite"}]},
  {key:"cond",label:"Conditional",forms:[{key:"ba",label:"if (formal)"},{key:"tara",label:"if / when"}]},
  {key:"vol",label:"Potential & volitional",forms:[{key:"kano",label:"can/able to"},{key:"iko",label:"let's"},{key:"mei",label:"imperative"},{key:"kin",label:"prohibition"}]},
  {key:"pass",label:"Passive & causative",forms:[{key:"ukemi",label:"passive"},{key:"shieki",label:"causative"},{key:"shiekiukemi",label:"caus-passive"}]},
  {key:"te2",label:"te-compounds",forms:[{key:"teiru",label:"ongoing/state"},{key:"teoku",label:"in advance"},{key:"teshimau",label:"completion/regret"},{key:"teageru",label:"do for s.o."},{key:"temorau",label:"have s.o. do"},{key:"tekureru",label:"s.o. does for me"}]}
];
var IADJ_GROUPS = [
  {key:"basic",label:"Basic",forms:[{key:"kute",label:"te / and"},{key:"kunai",label:"negative"},{key:"katta",label:"past"},{key:"kunakata",label:"past negative"}]},
  {key:"deriv",label:"Derived",forms:[{key:"ku",label:"adverb"},{key:"sa",label:"noun (sa)"}]}
];
var NAADJ_GROUPS = [
  {key:"basic",label:"Basic",forms:[{key:"de",label:"te / and"},{key:"janai",label:"negative"},{key:"datta",label:"past"},{key:"janakata",label:"past negative"}]},
  {key:"deriv",label:"Derived",forms:[{key:"ni",label:"adverb"},{key:"sa",label:"noun (sa)"}]}
];

function getGroups(type) {
  if (type.startsWith("verb")) return VERB_GROUPS;
  if (type === "i-adj") return IADJ_GROUPS;
  if (type === "na-adj") return NAADJ_GROUPS;
  return [];
}

// ---- CONJUGATION ENGINE ----
var U_ROW   = {"u":"\u308F","ku":"\u304B","gu":"\u304C","su":"\u3055","tsu":"\u305F","nu":"\u306A","bu":"\u3070","mu":"\u307E","ru":"\u3089"};
var U_MASU  = {"u":"\u3044","ku":"\u304D","gu":"\u304E","su":"\u3057","tsu":"\u3061","nu":"\u306B","bu":"\u3073","mu":"\u307F","ru":"\u308A"};
var U_E     = {"u":"\u3048","ku":"\u3051","gu":"\u3052","su":"\u305B","tsu":"\u3066","nu":"\u306D","bu":"\u3079","mu":"\u3081","ru":"\u308C"};
var U_O     = {"u":"\u304A","ku":"\u3053","gu":"\u3054","su":"\u305D","tsu":"\u3068","nu":"\u306E","bu":"\u307C","mu":"\u3082","ru":"\u308D"};

function lastKana(w) {
  // Return the final kana (handles multi-byte properly)
  return w.slice(-1);
}
function stemU(w) { return w.slice(0,-1); }

function uTe(w) {
  if (w === "\u884C\u304F") return "\u884C\u3063\u3066"; // 行く->行って
  var last = lastKana(w), stem = stemU(w);
  var m = {"\u304F":"\u3044\u3066","\u3050":"\u3044\u3067","\u3059":"\u3057\u3066","\u3064":"\u3063\u3066","\u308B":"\u3063\u3066","\u3046":"\u3063\u3066","\u306C":"\u3093\u3067","\u3076":"\u3093\u3067","\u3080":"\u3093\u3067"};
  return stem + (m[last] || "?");
}
function uTa(w) {
  if (w === "\u884C\u304F") return "\u884C\u3063\u305F"; // 行く->行った
  var last = lastKana(w), stem = stemU(w);
  var m = {"\u304F":"\u3044\u305F","\u3050":"\u3044\u3060","\u3059":"\u3057\u305F","\u3064":"\u3063\u305F","\u308B":"\u3063\u305F","\u3046":"\u3063\u305F","\u306C":"\u3093\u3060","\u3076":"\u3093\u3060","\u3080":"\u3093\u3060"};
  return stem + (m[last] || "?");
}

function conjugate(word, type) {
  var f = {};
  if (!word || type === "noun" || type === "expression") return f;

  if (type === "i-adj") {
    var s = word.endsWith("\u3044") ? word.slice(0,-1) : word;
    f.kute = s+"\u304F\u3066"; f.kunai = s+"\u304F\u306A\u3044"; f.katta = s+"\u304B\u3063\u305F";
    f.kunakata = s+"\u304F\u306A\u304B\u3063\u305F"; f.ku = s+"\u304F"; f.sa = s+"\u3055";
    return f;
  }
  if (type === "na-adj") {
    f.de = word+"\u3067"; f.janai = word+"\u3058\u3083\u306A\u3044"; f.datta = word+"\u3060\u3063\u305F";
    f.janakata = word+"\u3058\u3083\u306A\u304B\u3063\u305F"; f.ni = word+"\u306B"; f.sa = word+"\u3055";
    return f;
  }
  if (type === "verb-irr") {
    if (word === "\u6765\u308B") { // 来る
      f.te="\u6765\u3066";f.ta="\u6765\u305F";f.nai="\u6765\u306A\u3044";f.masu="\u6765\u307E\u3059";
      f.ba="\u6765\u308C\u3070";f.tara="\u6765\u305F\u3089";f.kano="\u6765\u3089\u308C\u308B";f.iko="\u6765\u3088\u3046";
      f.mei="\u6765\u3044";f.kin="\u6765\u308B\u306A";f.ukemi="\u6765\u3089\u308C\u308B";f.shieki="\u6765\u3055\u305B\u308B";
      f.shiekiukemi="\u6765\u3055\u305B\u3089\u308C\u308B";f.teiru="\u6765\u3066\u3044\u308B";f.teoku="\u6765\u3066\u304A\u304F";
      f.teshimau="\u6765\u3066\u3057\u307E\u3046";f.teageru="\u6765\u3066\u3042\u3052\u308B";f.temorau="\u6765\u3066\u3082\u3089\u3046";f.tekureru="\u6765\u3066\u304F\u308C\u308B";
    } else {
      var pre = word.endsWith("\u3059\u308B") ? word.slice(0,-2) : ""; // Xする
      f.te=pre+"\u3057\u3066";f.ta=pre+"\u3057\u305F";f.nai=pre+"\u3057\u306A\u3044";f.masu=pre+"\u3057\u307E\u3059";
      f.ba=pre+"\u3059\u308C\u3070";f.tara=pre+"\u3057\u305F\u3089";f.kano=pre+"\u3067\u304D\u308B";f.iko=pre+"\u3057\u3088\u3046";
      f.mei=pre+"\u3057\u308D";f.kin=word+"\u306A";f.ukemi=pre+"\u3055\u308C\u308B";f.shieki=pre+"\u3055\u305B\u308B";
      f.shiekiukemi=pre+"\u3055\u305B\u3089\u308C\u308B";f.teiru=pre+"\u3057\u3066\u3044\u308B";f.teoku=pre+"\u3057\u3066\u304A\u304F";
      f.teshimau=pre+"\u3057\u3066\u3057\u307E\u3046";f.teageru=pre+"\u3057\u3066\u3042\u3052\u308B";f.temorau=pre+"\u3057\u3066\u3082\u3089\u3046";f.tekureru=pre+"\u3057\u3066\u304F\u308C\u308B";
    }
    return f;
  }
  if (type === "verb-ru") {
    var s = word.slice(0,-1);
    var te = s+"\u3066";
    f.te=te;f.ta=s+"\u305F";f.nai=s+"\u306A\u3044";f.masu=s+"\u307E\u3059";
    f.ba=s+"\u308C\u3070";f.tara=s+"\u305F\u3089";f.kano=s+"\u3089\u308C\u308B";f.iko=s+"\u3088\u3046";
    f.mei=s+"\u308D";f.kin=word+"\u306A";f.ukemi=s+"\u3089\u308C\u308B";f.shieki=s+"\u3055\u305B\u308B";
    f.shiekiukemi=s+"\u3055\u305B\u3089\u308C\u308B";f.teiru=te+"\u3044\u308B";f.teoku=te+"\u304A\u304F";
    f.teshimau=te+"\u3057\u307E\u3046";f.teageru=te+"\u3042\u3052\u308B";f.temorau=te+"\u3082\u3089\u3046";f.tekureru=te+"\u304F\u308C\u308B";
    return f;
  }
  if (type === "verb-u") {
    var last = lastKana(word), stem = stemU(word);
    var naiS = {"\u3046":"\u308F","\u304F":"\u304B","\u3050":"\u304C","\u3059":"\u3055","\u3064":"\u305F","\u306C":"\u306A","\u3076":"\u3070","\u3080":"\u307E","\u308B":"\u3089"};
    var masuS = {"\u3046":"\u3044","\u304F":"\u304D","\u3050":"\u304E","\u3059":"\u3057","\u3064":"\u3061","\u306C":"\u306B","\u3076":"\u3073","\u3080":"\u307F","\u308B":"\u308A"};
    var eS = {"\u3046":"\u3048","\u304F":"\u3051","\u3050":"\u3052","\u3059":"\u305B","\u3064":"\u3066","\u306C":"\u306D","\u3076":"\u3079","\u3080":"\u3081","\u308B":"\u308C"};
    var oS = {"\u3046":"\u304A","\u304F":"\u3053","\u3050":"\u3054","\u3059":"\u305D","\u3064":"\u3068","\u306C":"\u306E","\u3076":"\u307C","\u3080":"\u3082","\u308B":"\u308D"};
    var te = uTe(word), ta = uTa(word);
    f.te=te;f.ta=ta;f.nai=stem+(naiS[last]||"?")+"\u306A\u3044";f.masu=stem+(masuS[last]||"?")+"\u307E\u3059";
    f.ba=stem+(eS[last]||"?")+"\u3070";f.tara=ta+"\u3089";f.kano=stem+(eS[last]||"?")+"\u308B";
    f.iko=stem+(oS[last]||"?")+"\u3046";f.mei=stem+(eS[last]||"?");f.kin=word+"\u306A";
    f.ukemi=stem+(naiS[last]||"?")+"\u308C\u308B";f.shieki=stem+(naiS[last]||"?")+"\u305B\u308B";
    f.shiekiukemi=stem+(naiS[last]||"?")+"\u305B\u3089\u308C\u308B";
    f.teiru=te+"\u3044\u308B";f.teoku=te+"\u304A\u304F";f.teshimau=te+"\u3057\u307E\u3046";
    f.teageru=te+"\u3042\u3052\u308B";f.temorau=te+"\u3082\u3089\u3046";f.tekureru=te+"\u304F\u308C\u308B";
    return f;
  }
  return f;
}

function getEffForms(w) {
  var auto = conjugate(w.japanese, w.type);
  var ov = w.overrides || {};
  var out = {};
  for (var k in auto) out[k] = auto[k];
  for (var k in ov) out[k] = ov[k];
  return out;
}

var activeTab="review", filterType="all", searchQ="";
var sessionDone=false, sessionKnown=0, sessionLearning=0;

var modalMode=null, editId=null, editOpenGroups={};
var STORAGE_KEY="poketto_v2";
var DATA_VERSION=2;

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function escAttr(v) { return esc(v); }
function normalizeWord(w, index) {
  return {
    id: w.id || Date.now() + (index || 0),
    japanese: String(w.japanese || "").trim(),
    reading: String(w.reading || "").trim(),
    meaning: String(w.meaning || "").trim(),
    type: TYPE_LABELS[w.type] ? w.type : "noun",
    overrides: w.overrides && typeof w.overrides === "object" ? w.overrides : {}
  };
}
function normalizePayload(d) {
  var next = d && typeof d === "object" ? d : {};
  var words = Array.isArray(next.vocab) ? next.vocab : DEFAULT_VOCAB;
  var cleanWords = words.map(normalizeWord).filter(function(w){return w.japanese && w.meaning;});
  return {version:DATA_VERSION,vocab:cleanWords,scores:next.scores && typeof next.scores==="object" ? next.scores : {}};
}
function makeBackupPayload() {
  return {app:"Poketto",version:DATA_VERSION,exportedAt:new Date().toISOString(),vocab:vocab,scores:scores};
}

function load() {
  try {
    var d=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(d){d=normalizePayload(d);vocab=d.vocab;scores=d.scores;}else{vocab=JSON.parse(JSON.stringify(DEFAULT_VOCAB));scores={};}
    vocab.forEach(function(w){if(!w.overrides)w.overrides={};});
  }catch(e){vocab=JSON.parse(JSON.stringify(DEFAULT_VOCAB));scores={};}
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:DATA_VERSION,vocab:vocab,scores:scores}));}catch(e){}}

function buildQueue(){
  var pool=filterType==="all"?vocab:vocab.filter(function(w){return w.type===filterType;});
  queue=pool.slice().sort(function(){return Math.random()-.5;});
  qIdx=0;flipped=false;sessionDone=false;sessionKnown=0;sessionLearning=0;
}

// ---- RENDER ----
function updateSub(){
  var learned=Object.values(scores).filter(function(s){return s.known>=1;}).length;
  document.getElementById("header-sub").textContent=vocab.length+" words \u00B7 "+learned+" learned";
}
function render(){
  updateSub();
  document.querySelectorAll(".nav-btn").forEach(function(btn){btn.classList.toggle("active",btn.dataset.tab===activeTab);});
  var el=document.getElementById("main-content");
  el.innerHTML=activeTab==="review"?renderReview():(activeTab==="words"?renderWords():renderSettings());
  attachHandlers();
}

function renderFilterRow(){
  var all='<button class="chip '+(filterType==="all"?"active":"")+'" data-filter="all">All</button>';
  var chips=ALL_TYPES.filter(function(t){return vocab.some(function(w){return w.type===t;});}).map(function(t){
    return '<button class="chip '+(filterType===t?"active":"")+'" data-filter="'+t+'"><span class="type-dot" style="background:'+TYPE_COLORS[t]+'"></span>'+TYPE_LABELS[t]+'</button>';
  }).join("");
  return '<div class="filter-row">'+all+chips+'</div>';
}

// ---- REVIEW ----
function renderFormsPanel(w, visible){
  var groups=getGroups(w.type);
  if(!groups.length)return "";
  var ef=getEffForms(w);
  var hasAny=groups.some(function(g){return g.forms.some(function(f){return ef[f.key];});});
  if(!hasAny)return "";
  var inner=groups.map(function(g,gi){
    var filled=g.forms.filter(function(f){return ef[f.key];});
    if(!filled.length)return "";
    var open=gi===0;
    return '<div><div class="fg-header" data-rg="'+gi+'"><span class="fg-title">'+g.label+'</span><span class="fg-arrow '+(open?"open":"")+'">&#9654;</span></div>'
      +'<div class="fg-body '+(open?"open":"")+'">'+filled.map(function(f){
        var edited=w.overrides&&w.overrides[f.key]?'<span class="edited-badge">edited</span>':"";
        return '<div class="form-row"><div class="form-lbl">'+esc(f.label)+'</div><div class="form-val">'+esc(ef[f.key])+edited+'</div></div>';
      }).join("")+'</div></div>';
  }).join("");
  return '<div class="forms-panel '+(visible?"visible":"")+'" id="forms-panel">'+inner+'</div>';
}

function renderReview(){
  var pool=filterType==="all"?vocab:vocab.filter(function(w){return w.type===filterType;});
  var fr=renderFilterRow();
  if(!pool.length)return fr+'<div class="empty"><div class="empty-char">&#31354;</div><div class="empty-text">No words in this category.</div></div>';
  if(sessionDone)return fr+'<div class="done-screen"><div class="done-kanji">&#23436;&#20102;</div><div class="done-label">Session complete</div><div class="done-stats"><div class="done-stat"><div class="done-num">'+sessionKnown+'</div><div class="done-stat-label">Knew it</div></div><div class="done-stat"><div class="done-num">'+sessionLearning+'</div><div class="done-stat-label">Learning</div></div></div><button class="btn-primary" style="max-width:200px;margin:0 auto" id="restart-btn">Review again</button></div>';
  if(!queue.length)buildQueue();
  var card=queue[qIdx];
  if(!card){buildQueue();return renderReview();}
  var color=TYPE_COLORS[card.type]||"#999";
  var segs=queue.map(function(_,i){return '<div class="progress-seg '+(i<qIdx?"done":i===qIdx?"current":"")+'"></div>';}).join("");
  return fr
    +'<div class="progress-bar">'+segs+'</div>'
    +'<div class="card-wrap" id="card-wrap">'
      +'<div class="card-inner '+(flipped?"flipped":"")+'" id="card-inner">'
        +'<div class="card-face card-front">'
          +'<div class="card-type-label" style="color:'+color+'">'+TYPE_LABELS[card.type]+'</div>'
          +'<div class="card-jp">'+esc(card.japanese)+'</div>'
          +'<div class="flip-hint" id="flip-hint">Tap to reveal</div>'
        +'</div>'
        +'<div class="card-face card-back">'
          +'<div class="card-type-label" style="color:'+color+'">'+TYPE_LABELS[card.type]+'</div>'
          +'<div class="card-reading">'+esc(card.reading||"")+'</div>'
          +'<div class="card-meaning" style="margin-top:10px">'+esc(card.meaning)+'</div>'
        +'</div>'
      +'</div>'
    +'</div>'
    +renderFormsPanel(card,flipped)
    +'<div class="grade-row '+(flipped?"":"hidden")+'">'
      +'<button class="btn btn-learning" id="grade-learning">Still learning</button>'
      +'<button class="btn btn-known" id="grade-known">Knew it</button>'
    +'</div>'
    +'<div class="session-counter">'+(qIdx+1)+' / '+queue.length+'</div>';
}

// ---- WORDS ----
function renderWords(){
  var fr=renderFilterRow();
  var pool=filterType==="all"?vocab.slice():vocab.filter(function(w){return w.type===filterType;});
  if(searchQ){
    var q=searchQ.toLowerCase();
    pool=pool.filter(function(w){return w.japanese.indexOf(searchQ)>=0||(w.reading&&w.reading.indexOf(searchQ)>=0)||w.meaning.toLowerCase().indexOf(q)>=0;});
  }
  var searchBar='<div class="search-wrap"><span class="search-icon">&#128269;</span><input class="search-input" id="search-input" placeholder="Search words\u2026" value="'+escAttr(searchQ)+'" />'
    +'<button class="search-clear '+(searchQ?"visible":"")+'" id="search-clear">&#x2715;</button></div>';
  if(!pool.length){
    var msg=searchQ?"No matches for \u201C"+esc(searchQ)+"\u201D":"No words yet.";
    return fr+searchBar+'<div class="no-results">'+msg+'</div>';
  }
  var grouped={};
  pool.forEach(function(w){if(!grouped[w.type])grouped[w.type]=[];grouped[w.type].push(w);});
  var html=fr+searchBar;
  ALL_TYPES.forEach(function(type){
    if(!grouped[type])return;
    html+='<div class="section-hd"><span class="type-dot" style="background:'+TYPE_COLORS[type]+'"></span>'+TYPE_LABELS[type]+'</div>';
    grouped[type].forEach(function(w){
      var s=scores[w.id]||{},known=s.known||0,learning=s.learning||0;
      var edits=Object.keys(w.overrides||{}).length;
      html+='<div class="word-row" data-edit="'+w.id+'">'
        +'<div style="flex:1;min-width:0">'
          +'<div class="word-jp">'+esc(w.japanese)+'<span class="word-kana">'+esc(w.reading||"")+'</span></div>'
          +'<div class="word-meaning">'+esc(w.meaning)+'</div>'
          +(edits>0?'<div class="word-meta">'+edits+' edited form'+(edits>1?"s":"")+'</div>':"")
        +'</div>'
        +((known>0||learning>0)?'<div class="recall-pill">&#10003;'+known+' &#10007;'+learning+'</div>':"")
        +'<button class="del-btn" data-del="'+w.id+'">&#x2715;</button>'
      +'</div>';
    });
  });
  return html;
}

function exportBackup(){
  var payload=JSON.stringify(makeBackupPayload(),null,2);
  var blob=new Blob([payload],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="poketto-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},500);
}
function importBackupFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var parsed=normalizePayload(JSON.parse(reader.result));
      if(!parsed.vocab.length){alert("That backup does not contain any words.");return;}
      if(!confirm("Import "+parsed.vocab.length+" words and replace this device's current Poketto data?"))return;
      vocab=parsed.vocab;scores=parsed.scores;filterType="all";searchQ="";buildQueue();save();render();
    }catch(e){alert("I could not read that backup file.");}
  };
  reader.readAsText(file);
}

function renderAddBody(){

      +'<div><label class="dfl">Meaning *</label><input class="dfi" id="a-meaning" placeholder="to eat" value="'+safeM+'" /></div>'

      addState.meaning=document.getElementById("a-meaning").value||"";

function saveAdd(){
  var jp=(document.getElementById("a-jp").value||"").trim();
  var reading=(document.getElementById("a-reading").value||"").trim();
  var meaning=(document.getElementById("a-meaning").value||"").trim();
  if(!jp||!meaning){alert("Japanese and meaning are required.");return;}
  var savedType=addState.type;
  vocab.push({id:Date.now(),japanese:jp,reading:reading,meaning:meaning,type:savedType,overrides:{}});
  save();
  addState={japanese:"",reading:"",meaning:"",type:"noun"};
  closeModal();
  filterType=savedType;
  activeTab="words";
  render();
}

// ---- DETAIL / EDIT MODAL ----
function openDetailModal(id){
  modalMode="edit";editId=id;editOpenGroups={};
  var w=vocab.find(function(v){return v.id===id;});
  if(!w)return;
  var color=TYPE_COLORS[w.type]||"#999";
  document.getElementById("modal-title").innerHTML=esc(w.japanese)+(w.reading?' <span style="font-size:14px;color:var(--muted);font-family:\'Noto Serif JP\',serif">'+esc(w.reading)+'</span>':"");
  document.getElementById("modal-subtitle").innerHTML='<span style="color:'+color+'">'+TYPE_LABELS[w.type]+'</span>';
  document.getElementById("modal-footer").innerHTML='<button class="btn-danger" id="modal-delete">Delete</button><button class="btn-save" id="modal-save-edit">Save changes</button>';
  renderDetailBody(w);
  document.getElementById("modal-overlay").classList.remove("hidden");
  document.getElementById("modal-save-edit").addEventListener("click",saveEdit);
  document.getElementById("modal-delete").addEventListener("click",function(){
    if(!confirm("Delete this word from Poketto?"))return;
    vocab=vocab.filter(function(v){return v.id!==editId;});
    delete scores[editId];
    save();closeModal();render();
  });
}
function renderDetailBody(w){
  var s=scores[w.id]||{},known=s.known||0,learning=s.learning||0;
  var groups=getGroups(w.type);
  var autoForms=conjugate(w.japanese,w.type);
  var overrides=w.overrides||{};
  var html='<div class="detail-section">'
    +'<div style="margin-bottom:10px"><label class="dfl">Meaning</label><input class="dfi" id="e-meaning" value="'+escAttr(w.meaning)+'" /></div>'
    +'<div style="margin-bottom:10px"><label class="dfl">Reading</label><input class="dfi jp" id="e-reading" value="'+escAttr(w.reading||"")+'" /></div>'
    +'<div><label class="dfl">Japanese</label><input class="dfi jp" id="e-jp" value="'+escAttr(w.japanese)+'" /></div>'
    +'</div>';
  if(known>0||learning>0){
    html+='<div class="detail-section"><div class="dfl" style="margin-bottom:10px">Review history</div>'
      +'<div class="recall-row">'
        +'<div><div class="recall-stat-num" style="color:var(--green)">'+known+'</div><div class="recall-stat-label">Knew it</div></div>'
        +'<div><div class="recall-stat-num" style="color:var(--red)">'+learning+'</div><div class="recall-stat-label">Learning</div></div>'
      +'</div></div>';
  }
  if(groups.length){
    html+='<div class="fe-sec-hd"><span>Word forms</span><span class="auto-badge">&#9679; Auto-generated</span></div>';
    html+=groups.map(function(g,gi){
      var open=!!editOpenGroups[gi];
      return '<div class="fe-group"><div class="fe-gh" data-eg="'+gi+'"><span>'+g.label+'</span><span>'+(open?"\u25BE":"\u25B8")+'</span></div>'
        +'<div class="fe-gb '+(open?"open":"")+'">'+g.forms.map(function(f){
          var auto=autoForms[f.key]||"";
          var ov=overrides[f.key];
          var val=ov!==undefined?ov:auto;
          var isEdited=ov!==undefined&&ov!==auto;
          return '<div class="fe-row">'
            +'<div class="fe-lbl">'+esc(f.label)+'</div>'
            +'<input class="fe-inp '+(isEdited?"edited":"auto")+'" data-fk="'+escAttr(f.key)+'" data-auto="'+escAttr(auto)+'" value="'+escAttr(val)+'" placeholder="'+escAttr(auto||f.label)+'" />'
            +'<button class="fe-reset" style="visibility:'+(isEdited?"visible":"hidden")+'" data-rk="'+f.key+'">&#x21BA;</button>'
          +'</div>';
        }).join("")+'</div></div>';
    }).join("");
  }
  document.getElementById("modal-body").innerHTML=html;
  // accordions
  document.querySelectorAll("[data-eg]").forEach(function(el){
    el.addEventListener("click",function(){
      var gi=el.dataset.eg;
      editOpenGroups[gi]=!editOpenGroups[gi];
      el.nextElementSibling.classList.toggle("open",!!editOpenGroups[gi]);
      el.querySelector("span:last-child").textContent=editOpenGroups[gi]?"\u25BE":"\u25B8";
    });
  });
  // live edit
  document.querySelectorAll(".fe-inp").forEach(function(inp){
    inp.addEventListener("input",function(){
      var auto=inp.dataset.auto;
      var edited=inp.value!==auto;
      inp.className="fe-inp "+(edited?"edited":"auto");
      var rst=inp.nextElementSibling;
      if(rst)rst.style.visibility=edited?"visible":"hidden";
    });
  });
  // reset
  document.querySelectorAll(".fe-reset[data-rk]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var inp=document.querySelector('.fe-inp[data-fk="'+btn.dataset.rk+'"]');
      if(inp){inp.value=inp.dataset.auto;inp.className="fe-inp auto";btn.style.visibility="hidden";}
    });
  });
}
function saveEdit(){
  var w=vocab.find(function(v){return v.id===editId;});
  if(!w)return;
  var newJp=(document.getElementById("e-jp").value||"").trim()||w.japanese;
  w.meaning=(document.getElementById("e-meaning").value||"").trim()||w.meaning;
  w.reading=(document.getElementById("e-reading").value||"").trim();
  if(newJp!==w.japanese){w.japanese=newJp;w.overrides={};}
  else{w.japanese=newJp;}
  var autoForms=conjugate(w.japanese,w.type);
  document.querySelectorAll(".fe-inp[data-fk]").forEach(function(inp){
    var key=inp.dataset.fk,auto=autoForms[key]||"",val=inp.value.trim();
    if(val&&val!==auto)w.overrides[key]=val;else delete w.overrides[key];
  });
  save();closeModal();render();
}

function closeModal(){
  document.getElementById("modal-overlay").classList.add("hidden");
  modalMode=null;editId=null;editOpenGroups={};
}

// ---- GRADE ----
function grade(known){
  var card=queue[qIdx];
  var prev=scores[card.id]||{known:0,learning:0};
  scores[card.id]=known?{known:prev.known+1,learning:prev.learning}:{known:prev.known,learning:prev.learning+1};
  if(known)sessionKnown++;else sessionLearning++;
  save();
  if(qIdx+1>=queue.length){sessionDone=true;flipped=false;render();}
  else{qIdx++;flipped=false;render();}
}

// ---- ATTACH HANDLERS ----
function attachHandlers(){
  document.querySelectorAll("[data-filter]").forEach(function(el){
    el.addEventListener("click",function(){filterType=el.dataset.filter;buildQueue();render();});
  });
  var cw=document.getElementById("card-wrap");
  if(cw)cw.addEventListener("click",function(){
    flipped=!flipped;
    var ci=document.getElementById("card-inner");if(ci)ci.classList.toggle("flipped",flipped);
    var fp=document.getElementById("forms-panel");if(fp)fp.classList.toggle("visible",flipped);
    var gr=document.querySelector(".grade-row");if(gr)gr.classList.toggle("hidden",!flipped);
    var fh=document.getElementById("flip-hint");if(fh)fh.style.display=flipped?"none":"";
  });
  document.querySelectorAll("[data-rg]").forEach(function(el){
    el.addEventListener("click",function(){
      var body=el.nextElementSibling,arrow=el.querySelector(".fg-arrow");
      var open=body.classList.toggle("open");arrow.classList.toggle("open",open);
    });
  });
  var gk=document.getElementById("grade-known");if(gk)gk.addEventListener("click",function(){grade(true);});
  var gl=document.getElementById("grade-learning");if(gl)gl.addEventListener("click",function(){grade(false);});
  var rb=document.getElementById("restart-btn");if(rb)rb.addEventListener("click",function(){buildQueue();render();});
  document.querySelectorAll("[data-edit]").forEach(function(el){
    el.addEventListener("click",function(){openDetailModal(parseInt(el.dataset.edit));});
  });
  document.querySelectorAll("[data-del]").forEach(function(el){
    el.addEventListener("click",function(e){
      e.stopPropagation();
      var id=parseInt(el.dataset.del);
      if(!confirm("Delete this word from Poketto?"))return;
      vocab=vocab.filter(function(w){return w.id!==id;});
      delete scores[id];save();render();
    });
  });
  var si=document.getElementById("search-input");
  if(si)si.addEventListener("input",function(e){
    var pos=e.target.selectionStart;
    searchQ=e.target.value;
    render();
    var next=document.getElementById("search-input");
    if(next){next.focus({preventScroll:true});next.setSelectionRange(pos,pos);}
  });
  var sc=document.getElementById("search-clear");
  if(sc)sc.addEventListener("click",function(){searchQ="";render();});
  var ex=document.getElementById("export-btn");if(ex)ex.addEventListener("click",exportBackup);
  var im=document.getElementById("import-btn");if(im)im.addEventListener("click",function(){var file=document.getElementById("import-file");if(file)file.click();});
  var input=document.getElementById("import-file");if(input)input.addEventListener("change",function(e){importBackupFile(e.target.files[0]);e.target.value="";});
  var rp=document.getElementById("reset-progress-btn");if(rp)rp.addEventListener("click",function(){
    if(!confirm("Reset all review history? Your words will stay."))return;
    scores={};save();buildQueue();render();
  });
  var rd=document.getElementById("restore-defaults-btn");if(rd)rd.addEventListener("click",function(){
    if(!confirm("Replace your current vocabulary with the original starter words?"))return;
    vocab=JSON.parse(JSON.stringify(DEFAULT_VOCAB));scores={};filterType="all";searchQ="";buildQueue();save();render();
  });
}

// ---- NAV ----
document.querySelectorAll(".nav-btn").forEach(function(btn){
  btn.addEventListener("click",function(){
    activeTab=btn.dataset.tab;
    if(activeTab==="review")buildQueue();
    render();
  });
});
document.getElementById("add-btn").addEventListener("click",openAddModal);
document.getElementById("modal-close").addEventListener("click",closeModal);
document.getElementById("modal-overlay").addEventListener("click",function(e){if(e.target===e.currentTarget)closeModal();});

// ---- INIT ----
load();buildQueue();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});
</script>
