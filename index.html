<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Poketto" />
  <meta name="theme-color" content="#1A1A1A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Poketto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.cn" crossorigin />
  <link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+JP:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" media="all" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" media="all" />
  <style>
    /* Ensure fonts never block rendering — UI shows immediately with system fonts */
    @font-face { font-family:'Noto Serif JP'; font-display:swap; }
    @font-face { font-family:'Inter'; font-display:swap; }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F6F3; --ink: #1A1A1A; --mid: #6B6966; --muted: #B0ADA6;
      --line: #E8E6E1; --gold: #C8A96E; --card-bg: #FFFFFF; --card-back: #1A1A1A;
      --red: #C0392B; --green: #4A8A6A;
      --safe-top: max(env(safe-area-inset-top, 0px), 18px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body { height:100%; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; }
    .header { padding:calc(var(--safe-top) + 20px) 20px 12px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; background:var(--bg); }
    .header-logo { font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; font-size:18px; font-weight:400; letter-spacing:1px; }
    .header-sub { font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-top:2px; }
    .btn-add-top { background:var(--ink); color:var(--bg); border:none; border-radius:3px; cursor:pointer; font-family:inherit; font-size:10px; font-weight:500; letter-spacing:.06em; padding:10px 14px; min-height:38px; }
    .nav { display:flex; border-bottom:1px solid var(--line); padding:0 20px; flex-shrink:0; background:var(--bg); }
    .nav-btn { background:none; border:none; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); padding:10px 14px 9px; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s,border-color .15s; }
    .nav-btn.active { color:var(--ink); border-bottom-color:var(--ink); }
    .scroll-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 20px calc(var(--safe-bottom) + 24px); }
    .filter-row { display:flex; gap:7px; padding:12px 0 4px; overflow-x:auto; scrollbar-width:none; }
    .filter-row::-webkit-scrollbar { display:none; }
    .chip { flex-shrink:0; padding:5px 11px; border-radius:20px; font-size:10px; font-weight:500; letter-spacing:0.5px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--mid); font-family:inherit; transition:all .15s; white-space:nowrap; display:flex; align-items:center; gap:5px; }
    .chip.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
    .type-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; display:inline-block; }
    .search-wrap { position:relative; margin:10px 0 4px; }
    .search-input { width:100%; padding:9px 12px 9px 34px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:13px; color:var(--ink); outline:none; appearance:none; -webkit-appearance:none; transition:border-color .15s; }
    .search-input:focus { border-color:var(--ink); }
    .search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none; }
    .search-clear { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px; padding:2px 4px; display:none; }
    .search-clear.visible { display:block; }
    .progress-bar { display:flex; gap:3px; padding:16px 0 12px; }
    .progress-seg { flex:1; height:2px; border-radius:1px; background:var(--line); }
    .progress-seg.done { background:var(--ink); }
    .progress-seg.current { background:var(--gold); }
    .card-wrap { perspective:1200px; cursor:pointer; user-select:none; -webkit-user-select:none; }
    .card-inner { position:relative; width:100%; height:230px; transform-style:preserve-3d; transition:transform 0.5s cubic-bezier(.4,0,.2,1); }
    .card-inner.flipped { transform:rotateY(180deg); }
    .card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 24px; }
    .card-front { background:var(--card-bg); border:1px solid var(--line); }
    .card-back { background:var(--card-back); transform:rotateY(180deg); color:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .card-type-label { position:absolute; top:12px; left:14px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; font-weight:500; }
    .card-jp { font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; font-size:54px; font-weight:300; letter-spacing:-1px; line-height:1; }
    .card-reading { font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; font-size:13px; color:var(--gold); margin-top:10px; letter-spacing:2px; }
    .card-meaning { font-size:17px; font-weight:400; text-align:center; line-height:1.4; color:var(--bg); }
    .recall-mode { position:absolute; top:12px; right:14px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; font-weight:500; color:var(--muted); }
    .recall-question { font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; text-align:center; }
    .conj-target { display:inline-flex; align-items:center; justify-content:center; min-height:26px; padding:6px 12px; border:1px solid var(--line); border-radius:20px; background:#FAF8F2; font-size:10px; font-weight:600; letter-spacing:1.1px; text-transform:uppercase; color:var(--gold); margin-bottom:12px; text-align:center; }
    .recall-front-text { font-size:24px; font-weight:300; line-height:1.35; text-align:center; color:var(--ink); }
    .recall-front-text.jp { font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; font-size:48px; }
    .recall-front-sub { font-size:12px; color:var(--mid); margin-top:10px; text-align:center; line-height:1.4; }
    .recall-answer-label { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(247,246,243,0.48); margin-bottom:10px; }
    .recall-answer { font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; font-size:42px; font-weight:300; line-height:1.18; text-align:center; color:var(--bg); }
    .recall-answer.en { font-family:'Inter',system-ui,sans-serif; font-size:24px; line-height:1.35; }
    .recall-context { margin-top:12px; font-size:12px; color:rgba(247,246,243,0.58); text-align:center; line-height:1.45; }
    .answer-panel { width:100%; margin-top:18px; display:flex; flex-direction:column; gap:9px; }
    .answer-input { width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:3px; font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; font-size:19px; color:var(--ink); outline:none; text-align:center; appearance:none; -webkit-appearance:none; }
    .answer-input:focus { border-color:var(--ink); }
    .answer-actions { display:flex; gap:8px; }
    .answer-btn { flex:1; border:none; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500; letter-spacing:.06em; border-radius:3px; padding:10px; }
    .answer-btn.check { background:var(--ink); color:var(--bg); }
    .answer-btn.reveal { background:transparent; color:var(--mid); border:1px solid var(--line); }
    .answer-feedback { min-height:16px; font-size:11px; color:var(--mid); text-align:center; }
    .answer-feedback.correct { color:var(--green); }
    .answer-feedback.wrong { color:var(--red); }
    .auto-result { margin-top:10px; font-size:11px; color:var(--gold); text-align:center; min-height:16px; }
    .flip-hint { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:12px; font-weight:500; }
    .forms-panel { background:var(--card-bg); border:1px solid var(--line); border-radius:4px; margin-top:10px; overflow:hidden; opacity:0; transform:translateY(5px); transition:opacity .25s,transform .25s; pointer-events:none; }
    .forms-panel.visible { opacity:1; transform:none; pointer-events:auto; }
    .fg-header { display:flex; align-items:center; justify-content:space-between; padding:8px 14px; cursor:pointer; border-bottom:1px solid var(--line); background:var(--bg); user-select:none; }
    .fg-title { font-size:9px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); font-weight:500; }
    .fg-arrow { font-size:9px; color:var(--muted); transition:transform .2s; display:inline-block; }
    .fg-arrow.open { transform:rotate(90deg); }
    .fg-body { display:none; }
    .fg-body.open { display:block; }
    .form-row { display:flex; align-items:baseline; padding:7px 14px; border-bottom:1px solid var(--line); gap:10px; }
    .form-row:last-child { border-bottom:none; }
    .form-lbl { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-weight:500; width:76px; flex-shrink:0; line-height:1.5; }
    .form-val { font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; font-size:14px; color:var(--ink); }

    .forms-grid { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); }
    .forms-grid-hd { padding:5px 10px; font-size:8px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--bg); border-bottom:1px solid var(--line); }
    .forms-grid-hd.plain { border-right:1px solid var(--line); }
    .forms-grid-cell { padding:6px 8px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
    .forms-grid-cell .fe-inp { width:100%; font-size:13px; padding:5px 7px; margin-top:3px; }
    .forms-grid-cell .fe-reset { font-size:11px; padding:2px 4px; }
    .forms-grid-cell.polite { border-right:none; }
    .forms-grid-cell:last-child { border-bottom:none; }
    .forms-grid-cell:nth-last-child(2):nth-child(odd) { border-bottom:none; }
    .forms-grid-lbl { font-size:8px; letter-spacing:0.8px; color:var(--muted); text-transform:uppercase; margin-bottom:3px; }
    .forms-grid-val { font-family:'Noto Serif JP',serif; font-size:14px; color:var(--ink); }
    .edited-badge { font-size:8px; letter-spacing:1px; color:var(--gold); text-transform:uppercase; font-weight:600; margin-left:6px; }
    .grade-row { display:flex; gap:10px; margin-top:10px; transition:opacity .2s; }
    .grade-row.hidden { opacity:0; pointer-events:none; }
    .btn { flex:1; border:none; cursor:pointer; font-family:inherit; font-size:12px; font-weight:500; letter-spacing:.06em; border-radius:3px; padding:11px; transition:all .15s; }
    .btn-known { background:var(--ink); color:var(--bg); }
    .btn-learning { background:transparent; color:var(--ink); border:1px solid var(--line); }
    .session-counter { text-align:center; font-size:11px; color:var(--muted); margin-top:9px; }
    .done-screen { text-align:center; padding:48px 0; }
    .done-kanji { font-family:'Noto Serif JP',serif; font-size:50px; color:var(--gold); margin-bottom:6px; }
    .done-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:32px; }
    .done-stats { display:flex; justify-content:center; margin-bottom:36px; }
    .done-stat { padding:0 26px; }
    .done-stat+.done-stat { border-left:1px solid var(--line); }
    .done-num { font-size:36px; font-weight:300; }
    .done-stat-label { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:3px; }
    .section-hd { padding:16px 0 6px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:7px; }
    .word-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
    .word-row:last-child { border-bottom:none; }
    .word-jp { font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; font-size:16px; }
    .word-kana { font-family:'Noto Serif JP',serif; font-size:10px; color:var(--muted); margin-left:6px; }
    .word-meaning { font-size:11px; color:var(--mid); margin-top:1px; }
    .word-meta { font-size:9px; color:var(--gold); margin-top:1px; }
    .recall-pill { flex-shrink:0; font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px; background:#F0EDE6; color:var(--gold); }
    .del-btn { background:none; border:none; cursor:pointer; font-size:12px; color:var(--muted); padding:6px; flex-shrink:0; }
    .no-results { text-align:center; padding:40px 0; font-size:13px; color:var(--muted); }
    .form-screen { padding:16px 0; display:flex; flex-direction:column; gap:14px; }
    .field-label { display:block; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:6px; }
    .field-input { width:100%; padding:10px 12px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:14px; color:var(--ink); outline:none; appearance:none; -webkit-appearance:none; transition:border-color .15s; }
    .field-input:focus { border-color:var(--ink); }
    .jp-input { font-family:'Noto Serif JP',serif !important; font-size:18px !important; }
    .type-chips { display:flex; gap:7px; flex-wrap:wrap; }
    .type-chip { padding:6px 12px; border-radius:20px; font-size:10px; font-weight:500; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--mid); font-family:inherit; transition:all .15s; }
    .type-chip.selected { background:var(--ink); color:var(--bg); border-color:var(--ink); }
    .notice { font-size:11px; color:var(--mid); background:#F0EDE6; border-radius:3px; padding:8px 12px; line-height:1.5; }
    .notice b { color:var(--gold); font-weight:600; }
    .btn-primary { width:100%; background:var(--ink); color:var(--bg); border:none; border-radius:3px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:500; padding:13px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100; padding-top:env(safe-area-inset-top); }
    .modal-overlay.hidden { display:none; }
    .modal { position:absolute; bottom:0; left:0; right:0; background:var(--bg); border-radius:14px 14px 0 0; width:100%; max-width:560px; margin:0 auto; max-height:92vh; display:flex; flex-direction:column; padding-bottom:var(--safe-bottom); }
    .modal-header { display:flex; align-items:flex-start; justify-content:space-between; padding:18px 20px 12px; border-bottom:1px solid var(--line); flex-shrink:0; }
    .modal-title { font-family:'Noto Serif JP',serif; font-size:22px; font-weight:300; }
    .modal-subtitle { font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-top:3px; }
    .modal-close { background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); padding:4px 6px; }
    .modal-body { overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }
    .modal-footer { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:10px; flex-shrink:0; align-items:center; }
    .btn-danger { background:transparent; color:var(--red); border:1px solid #E8C4C0; border-radius:3px; cursor:pointer; font-family:inherit; font-size:11px; font-weight:500; padding:8px 14px; }
    .btn-save { background:var(--ink); color:var(--bg); border:none; border-radius:3px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:500; padding:10px 20px; margin-left:auto; }
    .detail-section { padding:14px 20px; border-bottom:1px solid var(--line); }
    .detail-section:last-child { border-bottom:none; }
    .dfl { font-size:9px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:5px; }
    .dfi { width:100%; padding:8px 10px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:13px; color:var(--ink); outline:none; appearance:none; -webkit-appearance:none; transition:border-color .15s; }
    .dfi:focus { border-color:var(--ink); }
    .dfi.jp { font-family:'Noto Serif JP',serif; font-size:17px; }
    .recall-row { display:flex; gap:24px; }
    .recall-stat-num { font-size:28px; font-weight:300; }
    .recall-stat-label { font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-top:2px; }
    .fe-sec-hd { padding:9px 20px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:500; background:var(--bg); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
    .auto-badge { font-size:8px; letter-spacing:1px; color:var(--green); font-weight:600; }
    .fe-group { border-bottom:1px solid var(--line); }
    .fe-group:last-child { border-bottom:none; }
    .fe-gh { padding:9px 20px; font-size:10px; font-weight:500; color:var(--mid); cursor:pointer; display:flex; align-items:center; justify-content:space-between; user-select:none; }
    .fe-gb { display:none; padding:4px 20px 10px; }
    .fe-gb.open { display:block; }
    .fe-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .fe-lbl { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-weight:500; width:76px; flex-shrink:0; line-height:1.5; }
    .fe-inp { flex:1; padding:7px 10px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:'Noto Serif JP',serif; font-size:14px; color:var(--ink); outline:none; appearance:none; -webkit-appearance:none; }
    .fe-inp.auto { border-color:transparent; background:#F7F9F7; color:var(--mid); }
    .fe-inp.edited { border-color:var(--gold); background:#FDFAF4; }
    .fe-reset { background:none; border:none; cursor:pointer; font-size:13px; color:var(--muted); padding:3px 5px; flex-shrink:0; }

    .speak-btn { background:none; border:none; cursor:pointer; padding:4px; line-height:0; flex-shrink:0; -webkit-tap-highlight-color:transparent; opacity:0.45; transition:opacity .15s; }
    .speak-btn:active { opacity:1; }
    .speak-btn svg { display:block; }

    .card-colloc { margin-top:14px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.12); width:100%; text-align:left; max-height:80px; overflow-y:auto; }
    .card-colloc-row { display:flex; align-items:baseline; gap:10px; padding:3px 0; }
    .card-colloc-jp { font-family:'Noto Serif JP',serif; font-size:13px; color:#F7F6F3; flex-shrink:0; }
    .card-colloc-gl { font-size:10px; color:rgba(247,246,243,0.5); letter-spacing:0.02em; }
    .colloc-panel { background:var(--card-bg); border:1px solid var(--line); border-radius:4px; margin-top:8px; overflow:hidden; }
    .colloc-hd { display:flex; align-items:center; justify-content:space-between; padding:8px 14px; cursor:pointer; background:var(--bg); user-select:none; -webkit-user-select:none; }
    .colloc-title { font-size:9px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); font-weight:500; }
    .colloc-arrow { font-size:9px; color:var(--muted); transition:transform .2s; display:inline-block; }
    .colloc-arrow.open { transform:rotate(90deg); }
    .colloc-body { display:none; }
    .colloc-body.open { display:block; }
    .colloc-row { padding:8px 14px; border-top:1px solid var(--line); }
    .colloc-jp { font-family:'Noto Serif JP',serif; font-size:14px; color:var(--ink); }
    .colloc-gloss { font-size:11px; color:var(--muted); margin-top:2px; }
    .colloc-edit-row { display:flex; align-items:center; gap:6px; margin-top:8px; }
    .colloc-inp-jp { flex:1; padding:7px 10px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:'Noto Serif JP',serif; font-size:14px; color:var(--ink); outline:none; appearance:none; -webkit-appearance:none; min-width:0; }
    .colloc-inp-gl { flex:1; padding:7px 10px; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:12px; color:var(--ink); outline:none; appearance:none; -webkit-appearance:none; min-width:0; }
    .colloc-inp-jp:focus, .colloc-inp-gl:focus { border-color:var(--ink); }
    .colloc-rm { background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px; padding:4px 6px; flex-shrink:0; }
    .colloc-add { background:none; border:none; cursor:pointer; font-family:inherit; font-size:11px; color:var(--mid); padding:10px 14px; display:block; width:100%; text-align:left; border-top:1px solid var(--line); }
    .colloc-add:hover { color:var(--ink); }
    .empty { text-align:center; padding:60px 0; }

<script>

// ---- CONJUGATION ENGINE ----
// (conjugation uses inline maps — see conjugate())

function lastKana(w) {
  // Return the final kana (handles multi-byte properly)
  return w.slice(-1);
}
function stemU(w) { return w.slice(0,-1); }

function uTe(w) {
  if (w === "\u884C\u304F") return "\u884C\u3063\u3066"; // 行く->行って
  var last = lastKana(w), stem = stemU(w);
  var m = {"\u304F":"\u3044\u3066","\u3050":"\u3044\u3067","\u3059":"\u3057\u3066","\u3064":"\u3063\u3066","\u308B":"\u3063\u3066","\u3046":"\u3063\u3066","\u306C":"\u3093\u3067","\u3076":"\u3093\u3067","\u3080":"\u3093\u3067"};
  return stem + (m[last] || "?");
}
function uTa(w) {
  if (w === "\u884C\u304F") return "\u884C\u3063\u305F"; // 行く->行った
  var last = lastKana(w), stem = stemU(w);
  var m = {"\u304F":"\u3044\u305F","\u3050":"\u3044\u3060","\u3059":"\u3057\u305F","\u3064":"\u3063\u305F","\u308B":"\u3063\u305F","\u3046":"\u3063\u305F","\u306C":"\u3093\u3060","\u3076":"\u3093\u3060","\u3080":"\u3093\u3060"};
  return stem + (m[last] || "?");
}

function conjugate(word, type) {
  var f = {};
  if (!word || type === "noun" || type === "expression") return f;

  if (type === "i-adj") {
    // Irregular i-adj stem exceptions: いい->よ, かっこいい->かっこよ
    var IADJ_IRR = {
      "\u3044\u3044":"\u3088",               // いい -> よ
      "\u304B\u3063\u3053\u3044\u3044":"\u304B\u3063\u3053\u3088" // かっこいい -> かっこよ
    };
    var s;
    if (IADJ_IRR[word]) {
      s = IADJ_IRR[word];
    } else {
      s = word.endsWith("\u3044") ? word.slice(0,-1) : word;
    }
    f.kute = s+"\u304F\u3066"; f.kunai = s+"\u304F\u306A\u3044"; f.katta = s+"\u304B\u3063\u305F";
    f.kunakata = s+"\u304F\u306A\u304B\u3063\u305F"; f.ku = s+"\u304F"; f.sa = s+"\u3055";
    f.desu=word+"\u3067\u3059";f.desunai=s+"\u304F\u306A\u3044\u3067\u3059";f.deshita=s+"\u304B\u3063\u305F\u3067\u3059";f.deshitanai=s+"\u304F\u306A\u304B\u3063\u305F\u3067\u3059";

  }
  if (type === "na-adj") {
    f.de = word+"\u3067"; f.janai = word+"\u3058\u3083\u306A\u3044"; f.datta = word+"\u3060\u3063\u305F";
    f.janakata = word+"\u3058\u3083\u306A\u304B\u3063\u305F"; f.ni = word+"\u306B"; f.sa = word+"\u3055";
    f.desu=word+"\u3067\u3059";f.desunai=word+"\u3058\u3083\u306A\u3044\u3067\u3059";f.deshita=word+"\u3060\u3063\u305F\u3067\u3059";f.deshitanai=word+"\u3058\u3083\u306A\u304B\u3063\u305F\u3067\u3059";

  }

      f.mei="\u6765\u3044";f.kin="\u6765\u308B\u306A";f.ukemi="\u6765\u3089\u308C\u308B";f.shieki="\u6765\u3055\u305B\u308B";

      f.masen="\u6765\u307E\u305B\u3093";f.mashita="\u6765\u307E\u3057\u305F";f.masendeshita="\u6765\u307E\u305B\u3093\u3067\u3057\u305F";f.masho="\u6765\u307E\u3057\u3087\u3046";
      f.nakatta="\u6765\u306A\u304B\u3063\u305F";f.nakereba="\u6765\u306A\u3051\u308C\u3070\u306A\u3089\u306A\u3044";f.naidekudasai="\u6765\u306A\u3044\u3067\u304F\u3060\u3055\u3044";
    } else {
      var pre = word.endsWith("\u3059\u308B") ? word.slice(0,-2) : ""; // Xする
      f.te=pre+"\u3057\u3066";f.ta=pre+"\u3057\u305F";f.nai=pre+"\u3057\u306A\u3044";f.masu=pre+"\u3057\u307E\u3059";
      f.ba=pre+"\u3059\u308C\u3070";f.tara=pre+"\u3057\u305F\u3089";f.kano=pre+"\u3067\u304D\u308B";f.iko=pre+"\u3057\u3088\u3046";
      f.mei=pre+"\u3057\u308D";f.kin=word+"\u306A";f.ukemi=pre+"\u3055\u308C\u308B";f.shieki=pre+"\u3055\u305B\u308B";
      f.shiekiukemi=pre+"\u3055\u305B\u3089\u308C\u308B";
      f.masen=pre+"\u3057\u307E\u305B\u3093";f.mashita=pre+"\u3057\u307E\u3057\u305F";f.masendeshita=pre+"\u3057\u307E\u305B\u3093\u3067\u3057\u305F";f.masho=pre+"\u3057\u307E\u3057\u3087\u3046";
      f.nakatta=pre+"\u3057\u306A\u304B\u3063\u305F";f.nakereba=pre+"\u3057\u306A\u3051\u308C\u3070\u306A\u3089\u306A\u3044";f.naidekudasai=pre+"\u3057\u306A\u3044\u3067\u304F\u3060\u3055\u3044";
    }

  }
  if (type === "verb-ru") {
    var s = word.slice(0,-1);
    var te = s+"\u3066";
    f.te=te;f.ta=s+"\u305F";f.nai=s+"\u306A\u3044";f.masu=s+"\u307E\u3059";
    f.ba=s+"\u308C\u3070";f.tara=s+"\u305F\u3089";f.kano=s+"\u3089\u308C\u308B";f.iko=s+"\u3088\u3046";
    f.mei=s+"\u308D";f.kin=word+"\u306A";f.ukemi=s+"\u3089\u308C\u308B";f.shieki=s+"\u3055\u305B\u308B";
    f.shiekiukemi=s+"\u3055\u305B\u3089\u308C\u308B";

    f.nakatta=s+"\u306A\u304B\u3063\u305F";f.nakereba=s+"\u306A\u3051\u308C\u3070\u306A\u3089\u306A\u3044";f.naidekudasai=s+"\u306A\u3044\u3067\u304F\u3060\u3055\u3044";
    return f;
  }
  if (type === "verb-u") {
    var last = lastKana(word), stem = stemU(word);
    var naiS = {"\u3046":"\u308F","\u304F":"\u304B","\u3050":"\u304C","\u3059":"\u3055","\u3064":"\u305F","\u306C":"\u306A","\u3076":"\u3070","\u3080":"\u307E","\u308B":"\u3089"};
    var masuS = {"\u3046":"\u3044","\u304F":"\u304D","\u3050":"\u304E","\u3059":"\u3057","\u3064":"\u3061","\u306C":"\u306B","\u3076":"\u3073","\u3080":"\u307F","\u308B":"\u308A"};
    var eS = {"\u3046":"\u3048","\u304F":"\u3051","\u3050":"\u3052","\u3059":"\u305B","\u3064":"\u3066","\u306C":"\u306D","\u3076":"\u3079","\u3080":"\u3081","\u308B":"\u308C"};
    var oS = {"\u3046":"\u304A","\u304F":"\u3053","\u3050":"\u3054","\u3059":"\u305D","\u3064":"\u3068","\u306C":"\u306E","\u3076":"\u307C","\u3080":"\u3082","\u308B":"\u308D"};
    var te = uTe(word), ta = uTa(word);
    f.te=te;f.ta=ta;f.nai=stem+(naiS[last]||"?")+"\u306A\u3044";f.masu=stem+(masuS[last]||"?")+"\u307E\u3059";
    f.ba=stem+(eS[last]||"?")+"\u3070";f.tara=ta+"\u3089";f.kano=stem+(eS[last]||"?")+"\u308B";
    f.iko=stem+(oS[last]||"?")+"\u3046";f.mei=stem+(eS[last]||"?");f.kin=word+"\u306A";
    f.ukemi=stem+(naiS[last]||"?")+"\u308C\u308B";f.shieki=stem+(naiS[last]||"?")+"\u305B\u308B";
    f.shiekiukemi=stem+(naiS[last]||"?")+"\u305B\u3089\u308C\u308B";

    var masuStem=stem+({"\u3046":"\u3044","\u304F":"\u304D","\u3050":"\u304E","\u3059":"\u3057","\u3064":"\u3061","\u306C":"\u306B","\u3076":"\u3073","\u3080":"\u307F","\u308B":"\u308A"}[last]||"?");
    f.masen=masuStem+"\u307E\u305B\u3093";f.mashita=masuStem+"\u307E\u3057\u305F";f.masendeshita=masuStem+"\u307E\u305B\u3093\u3067\u3057\u305F";f.masho=masuStem+"\u307E\u3057\u3087\u3046";
    f.nakatta=stem+({"\u3046":"\u308F","\u304F":"\u304B","\u3050":"\u304C","\u3059":"\u3055","\u3064":"\u305F","\u306C":"\u306A","\u3076":"\u3070","\u3080":"\u307E","\u308B":"\u3089"}[last]||"?")+"\u306A\u304B\u3063\u305F";
    f.nakereba=stem+({"\u3046":"\u308F","\u304F":"\u304B","\u3050":"\u304C","\u3059":"\u3055","\u3064":"\u305F","\u306C":"\u306A","\u3076":"\u3070","\u3080":"\u307E","\u308B":"\u3089"}[last]||"?")+"\u306A\u3051\u308C\u3070\u306A\u3089\u306A\u3044";
    var teStem2=uTe(word);f.naidekudasai=teStem2.slice(0,-1)+"\u306A\u3044\u3067\u304F\u3060\u3055\u3044";

function getEffForms(w) {
  var auto = conjugate(w.japanese, w.type);
  var ov = w.overrides || {};
  var out = {};
  for (var k in auto) out[k] = auto[k];
  for (var k in ov) out[k] = ov[k];
  return out;
}

var RECALL_MODES = {
  recognition: {label:"Meaning", question:"What does this mean?"},
  production: {label:"Japanese", question:"Recall the Japanese"},
  reading: {label:"Reading", question:"How do you read this?"},
  conjugation: {label:"Conjugation", question:"Conjugate this"}
};
var RECALL_CONJUGATIONS = [
  {key:"te", label:"Te form"},
  {key:"ta", label:"Past plain"},
  {key:"nai", label:"Negative plain"},
  {key:"masu", label:"Masu form"},
  {key:"kano", label:"Potential"},
  {key:"kunai", label:"Negative"},
  {key:"katta", label:"Past"},
  {key:"janai", label:"Negative"},
  {key:"datta", label:"Past"},
  {key:"ni", label:"Adverb"}
];

function getRecallConjugations(w) {
  var forms = getEffForms(w);
  return RECALL_CONJUGATIONS.filter(function(f){return forms[f.key] && forms[f.key].indexOf("?")<0;}).map(function(f){
    return {key:f.key,label:f.label,answer:forms[f.key]};
  });
}
function getRecallItems(w) {
  var items = [{word:w, mode:"recognition"}];
  if (w.meaning) items.push({word:w, mode:"production"});
  if (w.reading && w.reading !== w.japanese) items.push({word:w, mode:"reading"});
  var conj = getRecallConjugations(w);
  if (conj.length) {
    var pick = conj[Math.floor(Math.random()*conj.length)];
    items.push({word:w, mode:"conjugation", form:pick});
  }
  return items;
}
function getQueueWord(item) {
  return item && item.word ? item.word : item;
}
function recallForItem(item) {
  var w = getQueueWord(item);
  var mode = item && item.mode ? item.mode : "recognition";
  var meta = RECALL_MODES[mode] || RECALL_MODES.recognition;
  if (mode === "production") {
    return {mode:mode,label:meta.label,question:meta.question,front:w.meaning,frontClass:"",answer:w.japanese,answerClass:"",context:w.reading||""};
  }
  if (mode === "reading") {
    return {mode:mode,label:meta.label,question:meta.question,front:w.japanese,frontClass:"jp",answer:w.reading,answerClass:"",context:w.meaning||""};
  }
  if (mode === "conjugation") {
    var form = item.form || getRecallConjugations(w)[0] || {label:"Form",answer:""};
    return {mode:mode,label:meta.label,question:"Make this form",targetLabel:form.label,front:w.japanese,frontClass:"jp",frontSub:w.meaning||"",answer:form.answer,answerClass:"",context:w.reading||""};
  }
  return {mode:"recognition",label:meta.label,question:meta.question,front:w.japanese,frontClass:"jp",answer:w.meaning,answerClass:"en",context:w.reading||""};
}
function buildRecallQueue(words) {
  var out = words.map(function(w){
    var items = getRecallItems(w);
    return items[Math.floor(Math.random()*items.length)] || {word:w, mode:"recognition"};
  });
  return out.sort(function(a,b){
    var aw=getQueueWord(a), bw=getQueueWord(b);
    return getSRS(aw.id).box-getSRS(bw.id).box || Math.random()-.5;
  });
}

// ---- AUDIO ----
function speakJapanese(text){
  if(!text||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP";u.rate=0.9;
  window.speechSynthesis.speak(u);
}

// ---- SRS: Leitner 5-box ----
var SRS_INTERVALS=[0,1,2,4,8,16];
function todayStr() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function getSRS(id) {
  var s = scores[String(id)] || {};
  return {
    box: s.box != null ? s.box : 1,
    nextDue: s.nextDue || todayStr(),
    known: s.known || 0,
    learning: s.learning || 0
  };
}
function advanceSRS(id, knew) {
  var s = getSRS(id);
  var box = knew ? Math.min(s.box + 1, 5) : 1;
  var due = new Date();
  due.setDate(due.getDate() + (SRS_INTERVALS[box] || 1));
  var y = due.getFullYear();
  var m = String(due.getMonth() + 1).padStart(2, "0");
  var day = String(due.getDate()).padStart(2, "0");
  scores[String(id)] = {
    box: box,
    nextDue: y + "-" + m + "-" + day,
    known: s.known + (knew ? 1 : 0),
    learning: s.learning + (knew ? 0 : 1)
  };
}
function advanceSRSAuto(id, result) {
  var s = getSRS(id), box = s.box;
  if (result === "again") box = 1;
  else if (result === "hard") box = Math.max(1, box);
  else if (result === "good") box = Math.min(box + 1, 5);
  else if (result === "easy") box = Math.min(box + 2, 5);
  var due = new Date();
  var wait;
  if (result === "again") wait = 1;
  else if (result === "hard") wait = Math.max(1, Math.floor((SRS_INTERVALS[box] || 1) / 2));
  else wait = SRS_INTERVALS[box] || 1;
  due.setDate(due.getDate() + wait);
  var y = due.getFullYear();
  var m = String(due.getMonth() + 1).padStart(2, "0");
  var day = String(due.getDate()).padStart(2, "0");
  var knew = result !== "again";
  scores[String(id)] = {
    box: box,
    nextDue: y + "-" + m + "-" + day,
    known: s.known + (knew ? 1 : 0),
    learning: s.learning + (knew ? 0 : 1)
  };
}
function dueCount(pool){var t=todayStr();return pool.filter(function(w){return getSRS(w.id).nextDue<=t;}).length;}
function dueTomorrow(pool) {
  var tom = new Date();
  tom.setDate(tom.getDate() + 1);
  var y = tom.getFullYear();
  var m = String(tom.getMonth() + 1).padStart(2, "0");
  var day = String(tom.getDate()).padStart(2, "0");
  var ts = y + "-" + m + "-" + day;
  var t = todayStr();
  return pool.filter(function(w) {
    var nd = getSRS(w.id).nextDue;
    return nd > t && nd <= ts;
  });
}

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function escAttr(v) { return esc(v); }
function kanaFormFromReading(w, answer) {
  if (!w || !w.reading || !w.japanese || !answer) return "";
  return String(answer).replace(String(w.japanese), String(w.reading));
}
function normalizeAnswer(v) {
  return String(v || "")
    .trim()
    .replace(/[\s\u3000。、，．.・･]/g, "")
    .replace(/[！!？?]/g, "");
}
function getAcceptedAnswers(item, recall) {
  var w = getQueueWord(item);
  var answers = [recall.answer];
  var kanaAnswer = kanaFormFromReading(w, recall.answer);
  if (kanaAnswer && kanaAnswer !== recall.answer) answers.push(kanaAnswer);
  return answers.map(normalizeAnswer).filter(Boolean);
}
function isAnswerCorrect(input, item, recall) {
  var user = normalizeAnswer(input);
  return !!user && getAcceptedAnswers(item, recall).indexOf(user) >= 0;
}
function normalizeId(id, index) {
  if (id != null && id !== "") {
    var n = Number(id);
    if (!isNaN(n) && isFinite(n) && String(n) === String(id)) {
      return n;
    }
    return String(id);
  }
  return Date.now() + (index || 0);
}
function wordIdFromDataset(raw) {
  return Number(raw);
}
function normalizeWord(w, index) {
  return {
    id: normalizeId(w.id, index),
    japanese: String(w.japanese || "").trim(),
    reading: String(w.reading || "").trim(),
    meaning: String(w.meaning || "").trim(),
    type: TYPE_LABELS[w.type] ? w.type : "noun",
    overrides: w.overrides && typeof w.overrides === "object" ? w.overrides : {},
    collocations: Array.isArray(w.collocations) ? w.collocations.map(function(c){return{japanese:String(c.japanese||"").trim(),gloss:String(c.gloss||"").trim()};}).filter(function(c){return c.japanese;}) : []
  };
}
function normalizePayload(d) {
  var next = d && typeof d === "object" ? d : {};
  var words = Array.isArray(next.vocab) ? next.vocab : DEFAULT_VOCAB;
  var idMap = {};
  var cleanWords = words.map(function(w, i) {
    var normalized = normalizeWord(w, i);
    if (w.id != null && w.id !== "") {
      idMap[String(w.id)] = normalized.id;
    }
    return normalized;
  }).filter(function(w){return w.japanese && w.meaning;});
  var rawScores = next.scores && typeof next.scores === "object" ? next.scores : {};
  var normScores = {};
  Object.keys(rawScores).forEach(function(k) {
    var normalizedKey = idMap[k] !== undefined ? idMap[k] : String(Number(k) || k);
    normScores[String(normalizedKey)] = rawScores[k];
  });
  return {version: DATA_VERSION, vocab: cleanWords, scores: normScores};
}
function makeBackupPayload() {
  return {app:"Poketto",version:DATA_VERSION,exportedAt:new Date().toISOString(),vocab:vocab,scores:scores};
}

function load() {

function renderFormsPanel(w, visible){

  var hasAny=groups.some(function(g){return g.forms.some(function(f){return ef[f.key];});});
  if(!hasAny)return "";
  var inner=groups.map(function(g,gi){
    var filled=g.forms.filter(function(f){return ef[f.key];});
    if(!filled.length)return "";
    var open=gi===0;
    var body="";
    if(g.grid){
      // 2-col plain/polite grid
      var plain=filled.filter(function(f){return f.col==="plain";});
      var polite=filled.filter(function(f){return f.col==="polite";});
      var maxRows=Math.max(plain.length,polite.length);
      body='<div class="forms-grid">'
        +'<div class="forms-grid-hd plain">Plain</div><div class="forms-grid-hd polite">Polite</div>';

        var red=rf&&w.overrides&&w.overrides[rf.key]?'<span class="edited-badge">edited</span>':"";

      }

    } else {

function importBackupFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var parsed=normalizePayload(JSON.parse(reader.result));
      if(!parsed.vocab.length){alert("That backup does not contain any words.");return;}
      if(!confirm("Import "+parsed.vocab.length+" words and replace this device's current Poketto data?"))return;
      vocab=parsed.vocab;scores=parsed.scores;filterType="all";searchQ="";buildQueue();save();render();
    }catch(e){alert("I could not read that backup file.");}
  };
  reader.readAsText(file);
}

// ---- ADD MODAL ----
function openAddModal(){
  modalMode="add";
  document.getElementById("modal-title").textContent="New word";
  document.getElementById("modal-subtitle").textContent="";
  document.getElementById("modal-footer").innerHTML='<button class="btn-save" id="modal-save-add">Add to vocabulary</button>';
  renderAddBody();
  document.getElementById("modal-overlay").classList.remove("hidden");
  document.getElementById("modal-save-add").addEventListener("click",saveAdd);
}
function renderAddBody(){
  var typeChips=ALL_TYPES.map(function(t){return '<button class="type-chip '+(addState.type===t?"selected":"")+'" data-atype="'+t+'">'+TYPE_LABELS[t]+'</button>';}).join("");
  var needsForms=addState.type!=="noun"&&addState.type!=="expression";
  var safeJp=escAttr(addState.japanese);
  var safeR=escAttr(addState.reading);
  var safeM=escAttr(addState.meaning);
  document.getElementById("modal-body").innerHTML=
    '<div style="padding:16px 20px;display:flex;flex-direction:column;gap:14px">'
      +'<div><label class="dfl">Japanese *</label><input class="dfi jp" id="a-jp" placeholder="\u98DF\u3079\u308B" value="'+safeJp+'" /></div>'
      +'<div><label class="dfl">Reading (kana)</label><input class="dfi jp" id="a-reading" placeholder="\u305F\u3079\u308B" value="'+safeR+'" /></div>'
      +'<div><label class="dfl">Meaning *</label><input class="dfi" id="a-meaning" placeholder="to eat" value="'+safeM+'" /></div>'
      +'<div><label class="dfl">Type *</label><div class="type-chips">'+typeChips+'</div></div>'
      +(needsForms?'<div class="notice">Forms will be <b>auto-generated</b>. Edit them after saving.</div>':"")
    +'</div>';
  document.querySelectorAll("[data-atype]").forEach(function(el){
    el.addEventListener("click",function(){
      addState.japanese=document.getElementById("a-jp").value||"";
      addState.reading=document.getElementById("a-reading").value||"";
      addState.meaning=document.getElementById("a-meaning").value||"";
      addState.type=el.dataset.atype;
      renderAddBody();
      var btn=document.getElementById("modal-save-add");
      if(btn)btn.addEventListener("click",saveAdd);
    });
  });
}
function saveAdd(){
  var jp=(document.getElementById("a-jp").value||"").trim();
  var reading=(document.getElementById("a-reading").value||"").trim();
  var meaning=(document.getElementById("a-meaning").value||"").trim();
  if(!jp||!meaning){alert("Japanese and meaning are required.");return;}
  if(vocab.some(function(w){return w.japanese===jp;})){if(!confirm("「"+jp+"」 is already in your vocabulary. Add it again?"))return;}
  var savedType=addState.type;
  vocab.push({id:Date.now(),japanese:jp,reading:reading,meaning:meaning,type:savedType,overrides:{}});
  save();
  addState={japanese:"",reading:"",meaning:"",type:"noun"};
  closeModal();
  filterType=savedType;
  activeTab="words";
  render();
}

// ---- DETAIL / EDIT MODAL ----
function openDetailModal(id){
  modalMode="edit";editId=id;editOpenGroups={};
  var w=vocab.find(function(v){return String(v.id)===String(id);});
  if(!w)return;
  var color=TYPE_COLORS[w.type]||"#999";
  document.getElementById("modal-title").innerHTML=esc(w.japanese)+(w.reading?' <span style="font-size:14px;color:var(--muted);font-family:\'Noto Serif JP\',serif">'+esc(w.reading)+'</span>':"")+'<button class="speak-btn" id="modal-speak" style="font-size:17px;margin-left:6px;vertical-align:middle">&#128264;</button>';
  // wire speak after innerHTML set
  setTimeout(function(){var ms=document.getElementById("modal-speak");if(ms)ms.addEventListener("click",function(){speakJapanese(w.japanese);});},0);
  document.getElementById("modal-subtitle").innerHTML='<span style="color:'+color+'">'+TYPE_LABELS[w.type]+'</span>';
  document.getElementById("modal-footer").innerHTML='<button class="btn-danger" id="modal-delete">Delete</button><button class="btn-save" id="modal-save-edit">Save changes</button>';
  renderDetailBody(w);
  document.getElementById("modal-overlay").classList.remove("hidden");
  document.getElementById("modal-save-edit").addEventListener("click",saveEdit);
  document.getElementById("modal-delete").addEventListener("click",function(){
    if(!confirm("Delete this word from Poketto?"))return;
    vocab=vocab.filter(function(v){return v.id!==editId;});
    delete scores[String(editId)];
    save();closeModal();render();
  });
}
function renderDetailBody(w){
  var s=scores[w.id]||{},known=s.known||0,learning=s.learning||0;
  var groups=getGroups(w.type);
  var autoForms=conjugate(w.japanese,w.type);
  var overrides=w.overrides||{};
  var typeChips=ALL_TYPES.map(function(t){return '<button class="type-chip '+(w.type===t?"selected":"")+'" data-etype="'+t+'">'+TYPE_LABELS[t]+'</button>';}).join("");
  var html='<div class="detail-section">'
    +'<div style="margin-bottom:10px"><label class="dfl">Meaning</label><input class="dfi" id="e-meaning" value="'+escAttr(w.meaning)+'" /></div>'
    +'<div style="margin-bottom:10px"><label class="dfl">Reading</label><input class="dfi jp" id="e-reading" value="'+escAttr(w.reading||"")+'" /></div>'
    +'<div style="margin-bottom:10px"><label class="dfl">Japanese</label><input class="dfi jp" id="e-jp" value="'+escAttr(w.japanese)+'" /></div>'
    +'<div><label class="dfl">Type</label><div class="type-chips">'+typeChips+'</div></div>'
    +'</div>';
  if(known>0||learning>0){
    html+='<div class="detail-section"><div class="dfl" style="margin-bottom:10px">Review history</div>'
      +'<div class="recall-row">'
        +'<div><div class="recall-stat-num" style="color:var(--green)">'+known+'</div><div class="recall-stat-label">Knew it</div></div>'
        +'<div><div class="recall-stat-num" style="color:var(--red)">'+learning+'</div><div class="recall-stat-label">Learning</div></div>'
      +'</div></div>';
  }
  if(groups.length){
    html+='<div class="fe-sec-hd"><span>Word forms</span><span class="auto-badge">&#9679; Auto-generated</span></div>';
    html+=groups.map(function(g,gi){
      var open=g.grid||!!editOpenGroups[gi];
      if(g.grid){
        // 2-col grid layout for core forms
        var plain=g.forms.filter(function(f){return f.col==="plain";});
        var polite=g.forms.filter(function(f){return f.col==="polite";});
        var maxRows=Math.max(plain.length,polite.length);
        var rows="";
        for(var i=0;i<maxRows;i++){
          var lf=plain[i],rf=polite[i];
          var led=lf&&overrides[lf.key]?'<span class="edited-badge">edited</span>':"";
          var red=rf&&overrides[rf.key]?'<span class="edited-badge">edited</span>':"";
          var lfAuto=lf?autoForms[lf.key]||'':'';var lfOv=lf?overrides[lf.key]:undefined;var lfVal=lf?(lfOv!==undefined?lfOv:lfAuto):'';var lfEd=lf&&lfOv!==undefined&&lfOv!==lfAuto;
          var rfAuto=rf?autoForms[rf.key]||'':'';var rfOv=rf?overrides[rf.key]:undefined;var rfVal=rf?(rfOv!==undefined?rfOv:rfAuto):'';var rfEd=rf&&rfOv!==undefined&&rfOv!==rfAuto;
          rows+='<div class="forms-grid-cell plain">'+(lf?'<div class="forms-grid-lbl">'+esc(lf.label)+'</div>'+'<input class="fe-inp '+(lfEd?'edited':'auto')+'" data-fk="'+escAttr(lf.key)+'" data-auto="'+escAttr(lfAuto)+'" value="'+escAttr(lfVal)+'" placeholder="'+escAttr(lfAuto||lf.label)+'" />'+'<button class="fe-reset" style="visibility:'+(lfEd?'visible':'hidden')+'" data-rk="'+lf.key+'">&#x21BA;</button>':'')+'</div>';
          rows+='<div class="forms-grid-cell polite">'+(rf?'<div class="forms-grid-lbl">'+esc(rf.label)+'</div>'+'<input class="fe-inp '+(rfEd?'edited':'auto')+'" data-fk="'+escAttr(rf.key)+'" data-auto="'+escAttr(rfAuto)+'" value="'+escAttr(rfVal)+'" placeholder="'+escAttr(rfAuto||rf.label)+'" />'+'<button class="fe-reset" style="visibility:'+(rfEd?'visible':'hidden')+'" data-rk="'+rf.key+'">&#x21BA;</button>':'')+'</div>';
        }
        return '<div class="fe-group">'
          +'<div class="fe-gh">'
            +'<span>'+g.label+' <span style="font-size:8px;color:var(--gold);font-weight:600;letter-spacing:1px">CORE</span></span>'
          +'</div>'
          +'<div class="forms-grid">'
            +'<div class="forms-grid-hd plain">Plain</div><div class="forms-grid-hd polite">Polite</div>'
            +rows
          +'</div>'
        +'</div>';
      } else {
        var rows=g.forms.map(function(f){
          var auto=autoForms[f.key]||"";
          var ov=overrides[f.key];
          var val=ov!==undefined?ov:auto;
          var isEdited=ov!==undefined&&ov!==auto;
          return '<div class="fe-row">'
            +'<div class="fe-lbl">'+esc(f.label)+'</div>'
            +'<input class="fe-inp '+(isEdited?"edited":"auto")+'" data-fk="'+escAttr(f.key)+'" data-auto="'+escAttr(auto)+'" value="'+escAttr(val)+'" placeholder="'+escAttr(auto||f.label)+'" />'
            +'<button class="fe-reset" style="visibility:'+(isEdited?"visible":"hidden")+'" data-rk="'+f.key+'">&#x21BA;</button>'
          +'</div>';
        }).join("");
        return '<div class="fe-group">'
          +'<div class="fe-gh" data-eg="'+gi+'">'
            +'<span>'+g.label+'</span>'
            +'<span>'+(open?"\u25BE":"\u25B8")+'</span>'
          +'</div>'
          +'<div class="fe-gb '+(open?"open":"")+'">'+rows+'</div>'
        +'</div>';
      }
    }).join("");
  }
  // collocations editor
  var colls=w.collocations||[];
  var collHtml='<div class="fe-sec-hd"><span>Collocations</span><span style="font-size:9px;color:var(--muted);font-weight:400">shown on card back</span></div>'
    +'<div id="colloc-editor" style="padding:4px 20px 0">';
  colls.forEach(function(c,i){
    collHtml+='<div class="colloc-edit-row" data-ci="'+i+'">'
      +'<input class="colloc-inp-jp" data-ci="'+i+'" data-field="japanese" value="'+escAttr(c.japanese)+'" placeholder="e.g. \u96FB\u6c17\u3092\u3064\u3051\u308b" />'
      +'<input class="colloc-inp-gl" data-ci="'+i+'" data-field="gloss" value="'+escAttr(c.gloss||"")+'" placeholder="e.g. to turn on the light" />'
      +'<button class="colloc-rm" data-ci="'+i+'">&#x2715;</button>'
    +'</div>';
  });
  collHtml+='</div><button class="colloc-add" id="colloc-add-btn">+ Add collocation</button>';
  html+=collHtml;
  document.getElementById("modal-body").innerHTML=html;
  // colloc add row
  document.getElementById("colloc-add-btn").addEventListener("click",function(){
    var ed=document.getElementById("colloc-editor");
    var i=ed.querySelectorAll(".colloc-edit-row").length;
    var row=document.createElement("div");
    row.className="colloc-edit-row";row.dataset.ci=i;
    row.innerHTML='<input class="colloc-inp-jp" data-ci="'+i+'" data-field="japanese" placeholder="e.g. \u96FB\u6c17\u3092\u3064\u3051\u308b" />'
      +'<input class="colloc-inp-gl" data-ci="'+i+'" data-field="gloss" placeholder="e.g. to turn on the light" />'
      +'<button class="colloc-rm" data-ci="'+i+'">&#x2715;</button>';
    ed.appendChild(row);
    attachCollocHandlers();
    row.querySelector(".colloc-inp-jp").focus();
  });
  attachCollocHandlers();
  // type chips
  document.querySelectorAll("[data-etype]").forEach(function(el){
    el.addEventListener("click",function(){
      var w=vocab.find(function(v){return String(v.id)===String(editId);});
      if(w){
        w.type=el.dataset.etype;
        w.overrides={}; // clear overrides when type changes
        renderDetailBody(w);
      }
    });
  });
  // accordions
  document.querySelectorAll("[data-eg]").forEach(function(el){
    el.addEventListener("click",function(){
      var gi=el.dataset.eg;
      editOpenGroups[gi]=!editOpenGroups[gi];
      el.nextElementSibling.classList.toggle("open",!!editOpenGroups[gi]);
      el.querySelector("span:last-child").textContent=editOpenGroups[gi]?"\u25BE":"\u25B8";
    });
  });
  // live edit
  document.querySelectorAll(".fe-inp").forEach(function(inp){
    inp.addEventListener("input",function(){
      var auto=inp.dataset.auto;
      var edited=inp.value!==auto;
      inp.className="fe-inp "+(edited?"edited":"auto");
      var rst=inp.nextElementSibling;
      if(rst)rst.style.visibility=edited?"visible":"hidden";
    });
  });
  // reset
  document.querySelectorAll(".fe-reset[data-rk]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var inp=document.querySelector('.fe-inp[data-fk="'+btn.dataset.rk+'"]');
      if(inp){inp.value=inp.dataset.auto;inp.className="fe-inp auto";btn.style.visibility="hidden";}
    });
  });
}
function saveEdit(){
  var w=vocab.find(function(v){return String(v.id)===String(editId);});
  if(!w)return;
  var newJp=(document.getElementById("e-jp").value||"").trim()||w.japanese;
  w.meaning=(document.getElementById("e-meaning").value||"").trim()||w.meaning;
  w.reading=(document.getElementById("e-reading").value||"").trim();
  // type is already updated by the chip click handler
  if(newJp!==w.japanese){w.japanese=newJp;w.overrides={};}
  else{w.japanese=newJp;}
  var autoForms=conjugate(w.japanese,w.type);
  document.querySelectorAll(".fe-inp[data-fk]").forEach(function(inp){
    var key=inp.dataset.fk,auto=autoForms[key]||"",val=inp.value.trim();
    if(val&&val!==auto)w.overrides[key]=val;else delete w.overrides[key];
  });
  // collect collocations
  var newCollocs=[];
  document.querySelectorAll(".colloc-edit-row").forEach(function(row){
    var jp=(row.querySelector(".colloc-inp-jp")||{}).value||"";
    var gl=(row.querySelector(".colloc-inp-gl")||{}).value||"";
    jp=jp.trim();gl=gl.trim();
    if(jp)newCollocs.push({japanese:jp,gloss:gl});
  });
  w.collocations=newCollocs;
  save();closeModal();render();
}

function closeModal(){document.getElementById("modal-overlay").classList.add("hidden");modalMode=null;editId=null;editOpenGroups={};if(activeTab==="words"&&document.getElementById("words-list")){renderWordsList();updateSub();}}

// ---- GRADE ----
function grade(known){var card=getQueueWord(queue[qIdx]);advanceSRS(card.id,known);if(known)sessionKnown++;else sessionLearning++;save();if(qIdx+1>=queue.length){sessionDone=true;flipped=false;render();}else{qIdx++;flipped=false;render();}}
function autoGrade(result,label){
  if(autoAnswered)return;
  var item=queue[qIdx], card=getQueueWord(item);
  autoAnswered=true;
  advanceSRSAuto(card.id,result);
  if(result==="again")sessionLearning++;else sessionKnown++;
  save();
  var ar=document.getElementById("auto-result");if(ar)ar.textContent=label||"";
  flipped=true;
  var ci=document.getElementById("card-inner");if(ci)ci.classList.add("flipped");
  var fp=document.getElementById("forms-panel");if(fp)fp.classList.add("visible");
  var gr=document.querySelector(".grade-row");if(gr)gr.classList.remove("hidden");
}
function nextReviewCard(){
  if(qIdx+1>=queue.length){sessionDone=true;flipped=false;render();}
  else{qIdx++;flipped=false;render();}
}
function checkTypedAnswer(){
  var item=queue[qIdx], recall=recallForItem(item), input=document.getElementById("answer-input"), fb=document.getElementById("answer-feedback");
  if(!input||!fb)return;
  var elapsed=(Date.now()-(answerStartedAt||Date.now()))/1000;
  if(isAnswerCorrect(input.value,item,recall)){
    var result=elapsed<=6?"easy":(elapsed<=18?"good":"hard");
    fb.className="answer-feedback correct";
    fb.textContent="Correct · "+(result==="easy"?"Easy":result==="good"?"Good":"Hard")+" · "+elapsed.toFixed(1)+"s";
    autoGrade(result,"Correct · "+(result==="easy"?"Easy":result==="good"?"Good":"Hard")+" · "+elapsed.toFixed(1)+"s");
  }else{
    fb.className="answer-feedback wrong";
    fb.textContent="Not yet. Try again, or reveal the answer.";
    input.select();
  }
}
function revealTypedAnswer(){
  var fb=document.getElementById("answer-feedback");
  if(fb){fb.className="answer-feedback wrong";fb.textContent="Revealed · Again";}
  autoGrade("again","Revealed · Again");
}


function attachCollocHandlers(){
  document.querySelectorAll(".colloc-rm").forEach(function(btn){
    btn.onclick=function(){btn.closest(".colloc-edit-row").remove();};
  });
}
// ---- ATTACH HANDLERS ----
function attachHandlers(){
  document.querySelectorAll("[data-filter]").forEach(function(el){
    el.addEventListener("click",function(){
      var prevFilter=filterType;
      filterType=el.dataset.filter;
      // Rebuild queue when filter changes in review mode
      if(activeTab==="review"&&prevFilter!==filterType)buildQueue();
      render();
    });
  });
  var cw=document.getElementById("card-wrap");
  if(cw)cw.addEventListener("click",function(){
    var item=queue[qIdx], recall=item?recallForItem(item):null;
    if(recall&&recall.mode==="conjugation")return;
    flipped=!flipped;
    var ci=document.getElementById("card-inner");if(ci)ci.classList.toggle("flipped",flipped);
    var fp=document.getElementById("forms-panel");if(fp)fp.classList.toggle("visible",flipped);
    var gr=document.querySelector(".grade-row");if(gr)gr.classList.toggle("hidden",!flipped);
    var fh=document.getElementById("flip-hint");if(fh)fh.style.display=flipped?"none":"";
  });
  var ai=document.getElementById("answer-input");
  if(ai){ai.focus();ai.addEventListener("click",function(e){e.stopPropagation();});ai.addEventListener("input",function(){if(!answerStartedAt&&ai.value.trim())answerStartedAt=Date.now();});ai.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();checkTypedAnswer();}});}
  var ac=document.getElementById("answer-check");if(ac)ac.addEventListener("click",function(e){e.stopPropagation();checkTypedAnswer();});
  var ar=document.getElementById("answer-reveal");if(ar)ar.addEventListener("click",function(e){e.stopPropagation();revealTypedAnswer();});
  var nc=document.getElementById("next-card");if(nc)nc.addEventListener("click",function(){nextReviewCard();});
  // speak buttons
  var card=getQueueWord(queue[qIdx]);
  var sf=document.getElementById("speak-front");
  if(sf&&card)sf.addEventListener("click",function(e){e.stopPropagation();speakJapanese(card.japanese);});
  var sb=document.getElementById("speak-back");
  if(sb&&card)sb.addEventListener("click",function(e){e.stopPropagation();speakJapanese(card.japanese);});

  document.querySelectorAll("[data-rg]").forEach(function(el){
    el.addEventListener("click",function(){
      var body=el.nextElementSibling,arrow=el.querySelector(".fg-arrow");
      var open=body.classList.toggle("open");arrow.classList.toggle("open",open);
    });
  });
  var gk=document.getElementById("grade-known");if(gk)gk.addEventListener("click",function(){grade(true);});
  var gl=document.getElementById("grade-learning");if(gl)gl.addEventListener("click",function(){grade(false);});
  var rb=document.getElementById("restart-btn");if(rb)rb.addEventListener("click",function(){var pool=filterType==="all"?vocab:vocab.filter(function(w){return w.type===filterType;});queue=buildRecallQueue(pool);qIdx=0;flipped=false;sessionDone=false;sessionKnown=0;sessionLearning=0;render();});
  // word-row handlers attached by attachWordRowHandlers() after renderWordsList()
  var si=document.getElementById("search-input");
  if(si)si.addEventListener("input",function(){renderWordsList();});
  var sc=document.getElementById("search-clear");
  if(sc)sc.addEventListener("click",function(){var inp=document.getElementById("search-input");if(inp){inp.value="";inp.focus();}renderWordsList();});
  var ex=document.getElementById("export-btn");if(ex)ex.addEventListener("click",exportBackup);
  var im=document.getElementById("import-btn");if(im)im.addEventListener("click",function(){var file=document.getElementById("import-file");if(file)file.click();});
  var input=document.getElementById("import-file");if(input)input.addEventListener("change",function(e){importBackupFile(e.target.files[0]);e.target.value="";});
  var rp=document.getElementById("reset-progress-btn");if(rp)rp.addEventListener("click",function(){
    if(!confirm("Reset all review history? Your words will stay."))return;
    scores={};save();buildQueue();render();
  });
  var rd=document.getElementById("restore-defaults-btn");if(rd)rd.addEventListener("click",function(){
    if(!confirm("Replace your current vocabulary with the original starter words?"))return;
    vocab=JSON.parse(JSON.stringify(DEFAULT_VOCAB));scores={};filterType="all";searchQ="";var si=document.getElementById("search-input");if(si)si.value="";buildQueue();save();render();
  });
}

// ---- NAV ----
document.querySelectorAll(".nav-btn").forEach(function(btn){
  btn.addEventListener("click",function(){
    activeTab=btn.dataset.tab;
    // Only rebuild queue when switching TO review if no session is active
    if(activeTab==="review"&&(queue.length===0||sessionDone))buildQueue();
    render();
  });
});
document.getElementById("add-btn").addEventListener("click",openAddModal);
document.getElementById("modal-close").addEventListener("click",closeModal);
document.getElementById("modal-overlay").addEventListener("click",function(e){if(e.target===e.currentTarget)closeModal();});

// ---- INIT ----
load();buildQueue();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});
</script>
